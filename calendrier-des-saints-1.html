<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendrier des Saints</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--or:#d4af37;--orp:#f2d27a;--nuit:#12183a;--rouge:#7a1c2a;--parch:#f6ecd2;--encre:#2a1a10}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Times New Roman",serif;color:var(--orp);min-height:100vh;
background:radial-gradient(ellipse at 50% 0,#2a3580 0,transparent 60%),linear-gradient(#0d1130,#2a0d18);}
header{text-align:center;padding:18px 12px 6px}
.rose{width:92px;height:92px;margin:0 auto 6px;border-radius:50%;border:4px solid var(--or);
background:repeating-conic-gradient(#7a1c2a 0 15deg,#1b2a5c 15deg 30deg,#b8902e 30deg 45deg,#1b2a5c 45deg 60deg);
box-shadow:0 0 22px #d4af3788;display:grid;place-items:center;font-size:40px;color:var(--orp);text-shadow:0 0 8px #000}
h1{margin:0;font-size:1.7rem;letter-spacing:.06em;color:var(--or)}
.sub{font-size:.9rem;opacity:.85;margin-top:2px}
main{max-width:560px;margin:0 auto;padding:8px 12px 30px}
.nav{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.nav button{background:none;border:2px solid var(--or);color:var(--or);font-size:1.4rem;width:44px;height:44px;border-radius:50%}
.nav h2{margin:0;font-size:1.35rem}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;border:3px double var(--or);padding:8px;border-radius:10px;background:#0b0f2688}
.grid b{font-size:.7rem;text-align:center;color:var(--or)}
.d{min-height:48px;border-radius:6px;background:#ffffff0d;font-size:.8rem;padding:2px;text-align:center;border:1px solid transparent;color:inherit;font-family:inherit}
.d.s{background:linear-gradient(#7a1c2a,#4a0f1c);border-color:var(--or);cursor:pointer}
.d.s small{display:block;font-size:.55rem;line-height:1.1;overflow:hidden;max-height:2.2em;color:var(--orp)}
.d.t{outline:2px solid #fff}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ch button{background:linear-gradient(#7a1c2a,#4a0f1c);border:1px solid var(--or);color:var(--orp);border-radius:20px;padding:8px 12px;font-family:inherit;font-size:.9rem}
.vide{opacity:.7;text-align:center;width:100%}
#ov{position:fixed;inset:0;background:#000000cc;overflow:auto;display:none;padding:calc(12px + env(safe-area-inset-top,0px)) 10px calc(20px + env(safe-area-inset-bottom,0px));z-index:5}
#ov.on{display:block}
.card{position:relative;max-width:420px;margin:0 auto;background:var(--parch);color:var(--encre);border:6px solid var(--or);border-radius:18px;padding:34px 30px 38px;
box-shadow:0 0 0 3px var(--rouge),0 0 0 6px var(--or),0 10px 40px #000;
background-image:radial-gradient(circle at 50% 100%,#d4af3733,transparent 60%),repeating-linear-gradient(45deg,transparent 0 14px,#d4af3714 14px 15px)}
.cx{position:absolute;font-style:normal;display:flex;flex-direction:column;align-items:center;color:var(--rouge);font-size:1.3rem;line-height:1}
.cx b{font-size:1.1rem}
.tl{top:8px;left:10px}.br{bottom:8px;right:10px;transform:rotate(180deg)}
.x{position:sticky;top:0;float:right;z-index:6;background:var(--rouge);color:var(--orp);border:2px solid var(--or);border-radius:50%;width:40px;height:40px;font-size:1.2rem}
.por{display:block;width:62%;margin:0 auto;border:4px solid var(--or);border-radius:70px 70px 6px 6px;box-shadow:0 0 0 2px var(--rouge)}
.card h3{text-align:center;margin:12px 0 0;font-size:1.5rem;color:var(--rouge)}
.card .ti{text-align:center;font-style:italic;margin:2px 0 4px}
.card .dt{text-align:center;color:var(--rouge);letter-spacing:.2em;font-size:.85rem}
.card h4{margin:14px 0 4px;color:var(--rouge);border-bottom:1px solid var(--or);font-size:1rem;letter-spacing:.1em;text-transform:uppercase}
.card ul{margin:0;padding-left:20px}
.card p{margin:0;line-height:1.45}
.pr{font-style:italic;background:#d4af3726;border-left:4px solid var(--rouge);padding:8px 10px;border-radius:4px}
.hs{max-height:0;overflow:hidden;transition:max-height .7s ease}.hs.on{max-height:1200px}.hint{text-align:center;font-size:.8rem;color:var(--rouge);margin-top:6px}@keyframes pu{50%{opacity:.35}}#cr{cursor:pointer;animation:pu 1.8s infinite}
#bg{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:4;background:#0b0f26cc;border:2px solid var(--or);color:var(--or);border-radius:10px;width:44px;height:44px;font-size:1.4rem}
#dr{position:fixed;top:0;left:0;bottom:0;width:min(88vw,340px);background:linear-gradient(#10163a,#2a0d18);border-right:3px double var(--or);transform:translateX(-105%);transition:transform .3s;z-index:7;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#dr.on{transform:none}
.dh{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--or)}
#q{flex:1;min-width:0;padding:10px;border-radius:8px;border:1px solid var(--or);background:#0b0f26;color:var(--orp);font-size:1rem;font-family:inherit}
#dx{background:none;border:2px solid var(--or);color:var(--or);border-radius:50%;width:40px;height:40px}
#cnt{font-size:.75rem;padding:4px 12px;opacity:.8}
#dl{overflow:auto;flex:1;padding:0 8px calc(16px + env(safe-area-inset-bottom,0px))}
#dl button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #d4af3733;color:var(--orp);padding:9px 6px;font-family:inherit;font-size:.92rem}
#dl b{color:var(--or);display:inline-block;min-width:96px}
#dl h5{margin:12px 0 2px;color:var(--or);letter-spacing:.15em;text-transform:uppercase;font-size:.8rem}
.orn{text-align:center;color:var(--rouge);letter-spacing:.4em;margin:6px 0}
footer{text-align:center;font-size:.8rem;opacity:.7;padding:0 12px 20px}
</style>
</head>
<body>
<header><button id="bg" aria-label="Liste des saints">☰</button><div class="rose">✝</div><h1>✠ Calendrier des Saints ✠</h1><div class="sub">Touchez un saint pour ouvrir sa carte</div></header>
<main>
<div class="nav"><button id="pv" aria-label="Mois précédent">‹</button><h2 id="mt"></h2><button id="nx" aria-label="Mois suivant">›</button></div>
<div class="grid" id="g"></div>
<div class="ch" id="ch"></div>
</main>
<footer>✝ Ad majorem Dei gloriam ✝</footer>
<div id="dr"><div class="dh"><input id="q" type="search" placeholder="Chercher un saint…" autocomplete="off"><button id="dx" aria-label="Fermer">✕</button></div><div id="cnt"></div><div id="dl"></div></div>
<div id="ov"><button class="x" id="cl" aria-label="Fermer">✕</button><div id="cd"></div></div>
<script>
const M=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];

const X={"Saint Thomas d’Aquin":["Intelligence,Étude,Humilité","Timidité,Lenteur apparente","Seigneur, éclaire mon intelligence et affermis ma volonté ; que l’étude me conduise à t’aimer davantage.","Né vers 1225 près d’Aquino, Thomas entre chez les dominicains malgré l’opposition de sa famille. Élève d’Albert le Grand, il enseigne à Paris et en Italie. Sa Somme théologique associe foi et raison. Surnommé « le bœuf muet » pour sa carrure et son calme, il meurt en 1274 en se rendant au concile de Lyon.","Docteur de l’Église (v. 1225-1274)"],
"Saint Blaise":["Compassion,Foi,Courage","Légende abondante, peu de faits","Seigneur, par l’intercession de saint Blaise, protège-nous des maux de la gorge et de tout mal de l’âme.","Évêque de Sébaste, en Arménie, mort martyr vers 316 selon la tradition. On raconte qu’il guérit un enfant qui s’étouffait avec une arête, d’où la bénédiction des gorges le 3 février. Il est aussi invoqué pour les récoltes et les cardeurs de laine.","Évêque et martyr (IVe s.)"],
"Saint Dominique":["Prédication,Étude,Pauvreté","Austérité sévère","Seigneur, donne à ton Église des prédicateurs qui parlent de toi avec vérité et douceur.","Né vers 1170 en Castille, Dominique de Guzmán rencontre les cathares dans le sud de la France et choisit de les convaincre par la parole et la pauvreté. Il fonde à Toulouse, vers 1215, l’ordre des Prêcheurs, les dominicains. La tradition lui attribue la diffusion du rosaire. Il meurt à Bologne en 1221.","Fondateur des dominicains (v. 1170-1221)"],
"Sainte Claire":["Pauvreté,Prière,Fidélité","Rigueur envers elle-même","Seigneur, rends mon cœur libre et pauvre pour que ta lumière y brille chaque jour.","Née à Assise vers 1193, Claire entend prêcher François et quitte la maison familiale la nuit des Rameaux de 1212. Elle fonde à Saint-Damien les Pauvres Dames, les clarisses, et défend longtemps le « privilège de pauvreté ». Elle meurt en 1253, deux jours après l’approbation de sa règle.","Fondatrice des clarisses (1193-1253)"],
"Saint Benoît":["Équilibre,Obéissance,Hospitalité","Intransigeance de fondateur","Seigneur, apprends-nous à prier et à travailler dans la paix, et à accueillir chaque hôte comme toi-même.","Né vers 480 à Nursie, Benoît se retire à Subiaco puis fonde Monte Cassino vers 529. Sa Règle, équilibre de prière et de travail, structure le monachisme occidental. Il meurt vers 547. Paul VI le proclame patron de l’Europe en 1964.","Père des moines d’Occident (v. 480-547)"],
"Saint Maximilien Kolbe":["Don de soi,Courage,Dévotion mariale","Santé fragile","Seigneur, donne-moi la force d’aimer jusqu’au bout et d’offrir ma vie pour mes frères.","Prêtre franciscain polonais né en 1894, il fonde une maison d’édition et la cité religieuse de Niepokalanów. Arrêté par les nazis, il est envoyé à Auschwitz. En juillet 1941, il s’offre à mourir à la place d’un père de famille condamné. Il meurt le 14 août 1941 ; il est canonisé en 1982.","Prêtre et martyr (1894-1941)"],
"Saint Vincent de Paul":["Charité,Sens de l’organisation,Humilité","Caractère vif, qu’il maîtrisa","Seigneur, fais-moi voir ton visage dans chaque pauvre et donne-moi des mains pour le servir.","Né en 1581 dans les Landes, prêtre en 1600, Vincent découvre la misère des campagnes et des galériens. Il fonde la Congrégation de la Mission (lazaristes) et, avec Louise de Marillac, les Filles de la Charité. Il organise l’aide aux pauvres et la formation des prêtres. Il meurt à Paris en 1660.","Apôtre de la charité (1581-1660)"],
"Saint Jean Bosco":["Joie,Patience,Éducation","Santé usée par le travail","Seigneur, fais de moi un ami des jeunes, qui les accueille avec joie et les conduit vers toi.","Né en 1815 près de Turin dans une famille paysanne pauvre, Jean Bosco devient prêtre et se consacre aux jeunes ouvriers et aux orphelins. Il fonde l’Oratoire, puis les Salésiens en 1859, en misant sur l’amitié et la joie plutôt que sur la contrainte. Il meurt en 1888.","Éducateur de la jeunesse (1815-1888)"],
"Sainte Geneviève":["Confiance,Courage,Charité","Opposition de certains Parisiens","Seigneur, donne-nous la confiance de Geneviève : que la peur ne nous fasse jamais abandonner les nôtres.","Née vers 420 à Nanterre, Geneviève se consacre à Dieu dès l’adolescence. Quand Attila approche, vers 451, elle exhorte les Parisiens à ne pas fuir ; la ville est épargnée. Lors du siège par les Francs, elle organise le ravitaillement. Elle meurt vers 502 et devient la patronne de Paris.","Patronne de Paris (v. 420-502)"],
"Saint Louis":["Justice,Piété,Charité","Zèle religieux parfois sévère,Échecs de ses croisades","Seigneur, donne à ceux qui gouvernent la sagesse de rendre justice et le souci des plus pauvres.","Né en 1214, Louis IX devient roi de France à douze ans. Il rend la justice, protège les pauvres et fait construire la Sainte-Chapelle pour abriter la couronne d’épines. Parti en croisade, il est prisonnier en Égypte, puis meurt de maladie devant Tunis en 1270. Il est canonisé en 1297.","Roi de France (1214-1270)"],
"Saint François de Sales":["Douceur,Écoute,Sainteté ordinaire","Colère de jeunesse maîtrisée","Seigneur, donne-moi la douceur qui ouvre les cœurs et la patience de t’aimer dans la vie de tous les jours.","Né en 1567 en Savoie, François est évêque de Genève, installé à Annecy. Il ramène de nombreux protestants par la douceur. Dans l’Introduction à la vie dévote, il montre que la sainteté est possible pour tous dans la vie ordinaire. Il fonde la Visitation avec Jeanne de Chantal et meurt en 1622.","Évêque, docteur de l’Église (1567-1622)"],
"Saint Thomas Becket":["Fidélité à sa mission,Courage,Conversion","Faste de sa vie de chancelier,Obstination","Seigneur, donne-moi le courage de rester fidèle à ma conscience, même face à plus puissant que moi.","Chancelier du roi Henri II d’Angleterre, Thomas devient archevêque de Cantorbéry en 1162 et défend alors les droits de l’Église contre le roi. Exilé en France pendant six ans, il rentre en 1170. Le 29 décembre, quatre chevaliers l’assassinent dans sa cathédrale. Canonisé en 1173, son tombeau attire de nombreux pèlerins.","Archevêque et martyr (v. 1118-1170)"]};
const HH={"Sainte Viviane":"Viviane, ou Bibiane, est selon la tradition une jeune Romaine du IVe siècle, fille de chrétiens, persécutée sous Julien l’Apostat. Elle subit le martyre vers 363. Une église de Rome, Santa Bibiana, que le Bernin a ornée d’une statue de la sainte, conserve son souvenir.",
"Saint François Xavier":"Francisco de Xavier, né en 1506 en Navarre, étudie à Paris, où il rencontre Ignace de Loyola. Il fait partie des sept premiers compagnons des jésuites. Envoyé en 1541 en Inde, il prêche à Goa, en Malaisie, puis au Japon, avant de mourir en 1552 sur l’île de Sancian, à l’entrée de la Chine. Patron des missions.",
"Sainte Barbara":"Selon la tradition, Barbara est une jeune fille de Nicomédie, enfermée dans une tour par son père. Chrétienne, elle refuse le mariage et de renier sa foi. Son père la décapite lui-même. Elle est honorée comme patronne des mineurs, des artilleurs et des pompiers, car elle protège contre la mort soudaine.",
"Saint Ambroise":"Ambroise, né vers 340 à Trèves, est gouverneur de Milan quand, en 374, le peuple l’acclame comme évêque alors qu’il n’est pas encore baptisé. Il instruit l’empereur Théodose, compose des hymnes et baptise Augustin en 387. Il meurt en 397, docteur de l’Église.",
"Immaculée Conception":"Le 8 décembre, l’Église fête la conception de Marie, que Dieu a préservée du péché dès le premier instant, pour devenir la mère du Sauveur. Pie IX en proclame le dogme le 8 décembre 1854. À Lyon, la fête des Lumières naît de cette date.",
"Saint Pierre Fourier":"Pierre Fourier, né en 1565 à Mirecourt, en Lorraine, devient chanoine régulier puis curé de Mattaincourt. Il soigne sa paroisse en période de guerre et de peste, et fonde avec Alix Le Clerc la congrégation Notre-Dame pour instruire gratuitement les filles. Il meurt en 1640 à Gray.",
"Saint Romaric":"Romaric, noble de la cour d’Austrasie, vit dans le luxe avant de se convertir après la rencontre de saint Colomban. Il distribue ses biens et fonde en 620, dans les Vosges, le monastère de Remiremont, avec son ami Amé. Il meurt vers 653.",
"Saint Daniel":"Daniel le Stylite, né vers 409 en Mésopotamie, est moine avant de s’installer sur une colonne près de Constantinople, où il vit trente ans en prière. Les empereurs viennent le consulter, et il dispense des conseils de paix. Il meurt en 493.",
"Sainte Jeanne-Françoise de Chantal":"Jeanne-Françoise Frémyot, née en 1572 à Dijon, épouse le baron de Chantal et a six enfants. Veuve à vingt-huit ans, elle choisit saint François de Sales comme guide. En 1610, elle fonde avec lui, à Annecy, l’ordre de la Visitation. Elle meurt en 1641 à Moulins.",
"Sainte Lucie":"Lucie, jeune Siracusaine, promet de rester vierge et distribue sa dot aux pauvres. Dénoncée comme chrétienne par son fiancé, elle est condamnée en 304 sous Dioclétien et subit le martyre. Son nom, qui évoque la lumière, la fait invoquer pour la vue. En Suède, on célèbre la fête de Lucie le 13 décembre.",
"Saint Jean de la Croix":"Jean de Yepes, né en 1542 à Fontiveros, entre chez les carmes. Il rencontre Thérèse d’Avila et l’aide à réformer le Carmel. Emprisonné neuf mois à Tolède par des carmes hostiles à la réforme, il y compose ses plus beaux poèmes. Il meurt en 1591 ; docteur de l’Église.",
"Saint Gatien":"Gatien, selon Grégoire de Tours, est envoyé de Rome au IIIe siècle pour évangéliser la région de Tours. Il devient le premier évêque de la ville, malgré la persécution. Il meurt vers 301.",
"Saint Pierre Canisius":"Pierre Canisius, né en 1521 à Nimègue, devient jésuite et revient évangéliser l’Allemagne divisée par la Réforme. Il écrit un Catéchisme très répandu, fonde des collèges et reste un homme de dialogue. Il meurt à Fribourg, en Suisse, en 1597. Docteur de l’Église.",
"Sainte Françoise-Xavière Cabrini":"Née en 1850 en Lombardie, Françoise Cabrini fonde les Missionnaires du Sacré-Cœur. Envoyée par le pape Léon XIII aux États-Unis en 1889, elle s’occupe des immigrés italiens, bâtit écoles, hôpitaux et orphelinats. Elle meurt à Chicago en 1917. Première citoyenne américaine canonisée, en 1946.",
"Sainte Adèle":"Adèle, fille du roi Dagobert II, est mariée puis veuve. Elle fonde l’abbaye de Pfalzel, près de Trèves, dont elle est abbesse, et y accueille de nombreuses religieuses. Elle meurt au début du VIIIe siècle, honorée pour sa générosité.",
"Nativité du Seigneur":"Le 25 décembre, l’Église fête la naissance de Jésus à Bethléem, de Marie et Joseph, dans une étable, comme le raconte saint Luc. Des bergers, prévenus par des anges, viennent l’adorer. La fête est attestée à Rome en 336 ; elle ouvre le temps de Noël.",
"Saints Innocents":"Selon l’Évangile de Matthieu, le roi Hérode, apprenant la naissance d’un « roi des Juifs », fait tuer les garçons de Bethléem de moins de deux ans. José et Marie, avertis en songe, ont déjà fui en Égypte avec l’enfant. L’Église honore ces enfants comme les premiers martyrs.",
"Saint Sylvestre":"Sylvestre Ier est pape de 314 à 335, à l’époque de Constantin, quand l’Église sort des persécutions. Il établit la basilique du Latran et celle de Saint-Pierre. Il envoie des légats au concile de Nicée en 325. Il meurt le 31 décembre 335.",
"Toussaint":"Le 1er novembre, l’Église fête tous les saints, connus et inconnus, qui sont auprès de Dieu. La fête est fixée au 1er novembre au IXe siècle, sous le pape Grégoire IV. Elle rappelle que la sainteté est un appel adressé à tous les baptisés. En France, c’est un jour férié.",
"Commémoration des fidèles défunts":"Le 2 novembre, l’Église prie pour tous les défunts. Cette commémoration est née à Cluny, où l’abbé Odilon l’a instaurée vers 998, avant de se répandre dans toute l’Église latine. C’est le jour où l’on visite les tombes et où l’on fleurit les cimetières.",
"Saint Hubert":"Hubert, né vers 655, vit d’abord à la cour, où il aime la chasse. Après la mort de son épouse, il se tourne vers Dieu, devient évêque de Maastricht puis de Liège et évangélise les Ardennes. La légende dit qu’un cerf portant une croix lui serait apparu. Il meurt en 727 ; patron des chasseurs.",
"Saint Charles Borromée":"Charles Borromée, né en 1538 près du lac Majeur, est créé cardinal par son oncle le pape Pie IV, à vingt-deux ans. Archevêque de Milan, il applique le concile de Trente : séminaires, visites pastorales, réforme du clergé. Pendant la peste de 1576, il soigne et nourrit la population. Il meurt en 1584.",
"Sainte Sylvie":"Sylvie, ou Silvia, est la mère du pape Grégoire le Grand, issue d’une noble famille romaine. Devenue veuve, elle se retire près de l’église Saint-Sabas, sur l’Aventin, et vit de prière et de charité. Son fils lui rend hommage dans ses écrits.",
"Sainte Bertille":"Bertille, née dans le Soissonnais au VIIe siècle, entre au monastère de Jouarre. Elle devient la première abbesse de Chelles, fondé par la reine Bathilde, où elle accueille des moniales venues d’Angleterre. Elle meurt vers 704.",
"Saint Geoffroy":"Geoffroy, né vers 1065 près de Soissons, est moine puis abbé de Nogent-sous-Coucy, avant de devenir évêque d’Amiens en 1104. Il lutte contre la corruption du clergé et soutient les habitants d’Amiens pour la création de leur commune. Il meurt à Soissons en 1115. Il est l’un des grands évêques d’Amiens.",
"Saint Léon le Grand":"Léon, pape de 440 à 461, défend l’unité de la foi au concile de Chalcédoine, où son Tome est lu et acclamé. En 452, il rencontre Attila aux portes de l’Italie et le convainc de se retirer. Il tente aussi de préserver Rome après le sac de 455. Docteur de l’Église.",
"Saint Brice":"Brice, disciple de saint Martin, est d’abord un jeune orgueilleux que Martin traite avec patience. Il lui succède comme évêque de Tours en 397 et gouverne l’Église pendant plus de quarante ans. Il meurt en 444.",
"Saint Albert le Grand":"Albert, né vers 1200 en Souabe, devient dominicain et maître à Paris, où il a pour élève Thomas d’Aquin. Naturaliste curieux, il étudie la botanique, la zoologie et la chimie, défendant l’accord de la foi et de la science. Évêque de Ratisbonne, il meurt en 1280. Patron des scientifiques.",
"Sainte Marguerite d’Écosse":"Marguerite, née vers 1045, princesse anglo-saxonne réfugiée en Écosse, épouse le roi Malcolm III. Elle favorise la réforme de l’Église, élève huit enfants et nourrit chaque jour des pauvres. Elle meurt en 1093, peu après la mort de son mari. Patronne de l’Écosse.",
"Sainte Élisabeth de Hongrie":"Élisabeth, née en 1207, est fiancée dans son enfance au landgrave de Thuringe, Louis IV. Mariée, elle développe une grande charité, soigne des malades et partage son pain. Veuve à vingt ans, elle est chassée de la cour, puis fonde un hôpital à Marbourg, où elle meurt en 1231, à vingt-quatre ans.",
"Saint Tanguy":"Tanguy, ou Tanneguy, est un seigneur breton du VIe siècle. Après avoir fondé l’abbaye de Saint-Mathieu de Fine-Terre, dans le Finistère, avec son frère Gurval, il se consacre à la vie monastique. Son nom reste très répandu en Bretagne.",
"Saint Edmond":"Edmond, né en 841, devient roi d’East Anglie à quinze ans. Lorsque les Danois envahissent son royaume, il refuse de renier le Christ ou de se soumettre. Percé de flèches puis décapité en 869, il est honoré comme martyr. L’abbaye de Bury St Edmunds porte son nom.",
"Présentation de Marie":"Le 21 novembre, l’Église fête la présentation de Marie au Temple : selon une tradition ancienne, ses parents Anne et Joachim la consacrent à Dieu dans son enfance. La fête, née à Jérusalem au VIe siècle avec la basilique Sainte-Marie-la-Neuve, symbolise le don d’elle-même.",
"Sainte Cécile":"Cécile, jeune Romaine du IIIe siècle, est promise à un païen, Valérien, qu’elle convertit avec son frère Tiburce. Arrêtée, elle meurt décapitée après plusieurs jours de souffrance. La tradition dit qu’elle chantait Dieu dans son cœur lors de ses noces, d’où son rôle de patronne des musiciens.",
"Saint Clément":"Clément Ier, troisième successeur de Pierre, est pape vers 92 à 101. Il écrit une lettre aux Corinthiens pour rétablir la paix dans leur communauté : c’est l’un des plus anciens textes chrétiens après le Nouveau Testament. Exilé en Crimée, il meurt martyr, selon la tradition.",
"Sainte Flora":"Flora, née à Cordoue d’un père musulman et d’une mère chrétienne, est élevée dans la foi de sa mère. Dénoncée par son frère, elle est emprisonnée, puis décapitée en 851 avec sa compagne Marie. Elles comptent parmi les « martyrs de Cordoue ».",
"Sainte Catherine Labouré":"Catherine Labouré, née en 1806 dans une famille paysanne de Côte-d’Or, entre en 1830 chez les Filles de la Charité, rue du Bac, à Paris. Elle y raconte trois apparitions de la Vierge, qui lui demande de faire frapper la Médaille miraculeuse. Elle vit humblement, au service des vieillards, jusqu’à sa mort en 1876.",
"Sainte Delphine":"Delphine, née en 1283 en Provence, est mariée à Élzéar de Sabran. Tous deux décident de vivre dans la chasteté et la charité. Après la mort de son époux, elle se met au service des pauvres et reste fidèle à la prière. Elle meurt à Apt, en 1360.",
"Saint Jacques de la Marche":"Jacques, né en 1393 dans les Marches, en Italie, devient franciscain et gagne la réputation de grand prédicateur. Il parcourt l’Europe, de l’Italie à la Hongrie et à la Pologne, préchant la paix, la justice et la lutte contre l’usure. Il soutient les monts-de-piété. Il meurt en 1476.",
"Saints Anges gardiens":"Le 2 octobre, l’Église rend grâce pour les anges gardiens, que la tradition voit comme des compagnons invisibles de chaque personne. Cette croyance s’appuie sur l’Écriture, notamment sur la parole de Jésus : « Leurs anges, dans les cieux, voient sans cesse la face de mon Père. »",
"Saint Gérard":"Gérard de Brogne, né vers 895 près de Namur, quitte la vie de seigneur pour fonder l’abbaye de Brogne. Il réforme de nombreux monastères de Flandre, de Lotharingie et du nord de la France selon la règle bénédictine. Il meurt en 959.",
"Sainte Fleur":"Fleur, ou Flore, née dans le Quercy au XIVe siècle, entre à seize ans chez les Hospitalières de Saint-Jean de Jérusalem à Beaulieu. Elle vit dans la prière et le service des malades. Elle meurt en 1347, à trente-trois ans.",
"Saint Bruno":"Bruno, né vers 1030 à Cologne, enseigne la théologie à Reims. En 1084, il se retire avec six compagnons dans le massif de la Chartreuse, où l’évêque Hugues de Grenoble les accueille. C’est le début de l’ordre des chartreux, silence et solitude. Bruno meurt en Calabre en 1101.",
"Notre-Dame du Rosaire":"Le 7 octobre 1571, la flotte chrétienne remporte la bataille de Lépante. Le pape Pie V attribue la victoire à la prière du rosaire. Il institue une fête de Notre-Dame de la Victoire, devenue Notre-Dame du Rosaire. Le chapelet, avec ses dizaines de Je vous salue Marie, reste l’une des prières les plus répandues.",
"Saint Denis":"Denis, selon Grégoire de Tours, est envoyé de Rome en Gaule vers 250 et devient le premier évêque de Paris. Il est décapité sur la colline de Montmartre avec ses compagnons Rustique et Éleuthère. La légende dit qu’il marche, sa tête dans les mains, jusqu’à l’endroit où s’élève aujourd’hui la basilique de Saint-Denis.",
"Saint Ghislain":"Ghislain, selon la tradition, est un moine grec venu évangéliser le Hainaut au VIIe siècle. Il se retire dans une forêt près de Mons et y fonde un monastère. Autour de celui-ci naît la ville de Saint-Ghislain. Il meurt vers 680.",
"Saint Jean XXIII":"Angelo Roncalli, né en 1881 dans une famille paysanne de Lombardie, est prêtre, diplomate du Saint-Siège puis patriarche de Venise. Élu pape en 1958 à 77 ans, il convoque le concile Vatican II, ouvert en 1962. Surnommé le « pape bon », il meurt en 1963. Il est canonisé en 2014.",
"Saint Géraud":"Géraud, comte d’Aurillac, né en 855, est un seigneur laïc qui renonce à la violence et utilise sa fortune pour aider les pauvres. Il fonde l’abbaye d’Aurillac et vit en célibataire, simplement. Il meurt en 909. Sa vie, écrite par Odon de Cluny, est un modèle de sainteté laïque.",
"Saint Calixte":"Calixte, ancien esclave devenu banquier puis diacre, devient pape vers 217. Il administre les catacombes de la via Appia, qui portent son nom, et se montre miséricordieux envers les pécheurs repentants, ce qui lui vaut l’opposition d’Hippolyte. Il meurt martyr vers 222.",
"Sainte Edwige":"Edwige, ou Hedwige, née vers 1174 en Bavière, est mariée à douze ans au duc de Silésie, Henri le Barbu. Elle fonde des hôpitaux et le monastère de Trzebnica, soigne les lépreux et aide les pauvres. Veuve, elle se retire chez les cisterciennes. Elle meurt en 1243.",
"Saint Ignace d’Antioche":"Ignace, évêque d’Antioche, est condamné à mort sous Trajan et conduit à Rome pour y être livré aux bêtes. Pendant son voyage, il écrit sept lettres aux Églises, pleines de foi et d’unité. Il demande aux Romains de ne pas le sauver : « Je suis le froment du Christ. » Il meurt vers 107.",
"Saint Luc":"Luc, médecin d’origine grecque, est compagnon de Paul. Il écrit le troisième Évangile, attentif aux pauvres, aux femmes et à la miséricorde, et les Actes des Apôtres. La tradition le dit mort en Grèce, à plus de quatre-vingts ans. Patron des médecins et des artistes.",
"Saint Jean-Paul II":"Karol Wojtyla, né en 1920 près de Cracovie, est ouvrier, acteur, puis prêtre et archevêque de Cracovie. Élu pape en 1978, premier pape non italien depuis des siècles, il voyage dans plus de cent trente pays et contribue à la chute du bloc communiste. Il meurt en 2005 et est canonisé en 2014.",
"Saint Jean de Capistran":"Jean, né en 1386 en Italie, est juge avant de devenir franciscain. Il prêche en Europe centrale, rallie des foules et soutient la réforme de son ordre. En 1456, il organise la défense de Belgrade avec Jean Hunyadi contre les Ottomans. Il meurt peu après, la même année.",
"Saint Antoine-Marie Claret":"Antoine Claret, né en 1807 en Catalogne, est tisserand avant de devenir prêtre. Il prêche des missions populaires et fonde les Missionnaires du Cœur de Marie, les clarétains. Archevêque de Santiago de Cuba, il défend les pauvres et les esclaves. Il meurt en exil en France, en 1870.",
"Saints Crépin et Crépinien":"Crépin et Crépinien, deux frères romains, quittent Rome vers 285 pour évangéliser la Gaule. Ils s’installent à Soissons, où ils gagnent leur vie comme cordonniers tout en prêchant. Arrêtés, ils meurent martyrs. Ils sont les patrons des cordonniers et des savetiers.",
"Saint Dimitri":"Dimitri, d’après la tradition, est un officier romain de Thessalonique, ville dont il est le patron. Arrêté pour avoir confessé sa foi, il est mis à mort vers 306 sous l’empereur Galerius. Son culte est très répandu chez les orthodoxes, en Grèce et en Russie.",
"Saints Simon et Jude":"Simon, dit le Zélote, et Jude, aussi appelé Thaddée, sont deux des Douze. Jude est l’auteur d’une courte lettre du Nouveau Testament. Selon la tradition, ils prêchent ensemble en Perse et y subissent le martyre. Jude est invoqué dans les cas désespérés.",
"Saint Narcisse":"Narcisse, évêque de Jérusalem, vit aux IIe et IIIe siècles. Calomnié, il se retire au désert avant d’être rappelé par son peuple. Très âgé, il confie le soin du diocèse à un coévêque, Alexandre. Il meurt à plus de cent ans, selon Eusèbe.",
"Saint Quentin":"Quentin, originaire de Rome selon la tradition, vient évangéliser la Gaule du Nord vers 285. Il prêche en Picardie, à Amiens, puis à Augusta Viromanduorum. Arrêté sous Maximien, il est martyrisé. Son tombeau devient un lieu de pèlerinage et la ville de Saint-Quentin, dans l’Aisne, porte son nom.",
"Saint Gilles":"Gilles, d’origine grecque selon la tradition, vit en ermite en Provence, près du Rhône, vers la fin du VIIe siècle. Le roi wisigoth Wamba lui fait don de terres où il fonde une abbaye, origine de Saint-Gilles-du-Gard, grande étape du chemin de Compostelle. La légende parle d’une biche qu’il aurait protégée.",
"Saint Grégoire le Grand":"Grégoire, né vers 540 à Rome, est préfet de la ville avant de devenir moine. Pape en 590, il organise les secours aux pauvres au milieu de la peste et des guerres, envoie Augustin en Angleterre et réforme la liturgie, dont le chant dit grégorien porte son nom. Il se dit « serviteur des serviteurs de Dieu ». Il meurt en 604.",
"Sainte Rosalie":"Rosalie, née à Palerme au XIIe siècle, se retire près du mont Pellegrino pour vivre en ermite. Ses reliques sont retrouvées en 1624, pendant une épidémie de peste : la ville lui attribue la fin du fléau et la choisit pour patronne. Le festino de sainte Rosalie y est toujours célébré.",
"Sainte Teresa de Calcutta":"Agnès Gonxha Bojaxhiu, née en 1910 à Skopje, rejoint les sœurs de Lorette et enseigne à Calcutta. En 1946, elle ressent l’appel à servir les plus pauvres et fonde en 1950 les Missionnaires de la Charité. Prix Nobel de la paix en 1979, elle meurt en 1997 et est canonisée en 2016.",
"Saint Bertrand":"Bertrand de L’Isle, né vers 1040, est chanoine puis évêque de Comminges en 1083. Il reconstruit la ville et la cathédrale, défend les pauvres et réforme son diocèse. Il meurt en 1123. La ville de Saint-Bertrand-de-Comminges porte son nom.",
"Sainte Reine":"Selon la tradition, Reine est une jeune fille d’Alise, en Bourgogne, au IIIe siècle. Elle refuse d’épouser le gouverneur Olibrius et de renier sa foi, et meurt décapitée. Son culte attire des pèlerins à Alise-Sainte-Reine, en Côte-d’Or.",
"Nativité de la Vierge Marie":"Le 8 septembre, neuf mois après la fête de l’Immaculée Conception, l’Église célèbre la naissance de Marie, fille de Joachim et d’Anne selon la tradition. Elle y voit l’aurore du salut. La fête est attestée à Jérusalem dès le VIe siècle.",
"Saint Apollinaire":"Apollinaire, selon la tradition disciple de saint Pierre, serait le premier évêque de Ravenne, au IIe siècle, et y serait mort martyr. Deux basiliques de Ravenne, Sant’Apollinare in Classe et Sant’Apollinare Nuovo, célèbrent sa mémoire.",
"Croix glorieuse":"Le 14 septembre, l’Église fête la Croix glorieuse, souvenir de la dédicace de la basilique du Saint-Sépulcre à Jérusalem en 335, dont les chrétiens cherchaient la vraie Croix. En 629, l’empereur Héraclius la rapporte en procéssion. La croix, instrument de supplice, devient signe d’amour et de victoire.",
"Notre-Dame des Douleurs":"Le lendemain de la Croix glorieuse, l’Église honore Marie debout au pied de la croix, comme le raconte saint Jean, et lui associe les « sept douleurs » de sa vie. Le Stabat Mater, hymne médiéval, exprime cette compassion. C’est un jour de prière pour ceux qui souffrent.",
"Saint Cyprien":"Cyprien, né vers 200 à Carthage, est un rhéteur converti vers 246. Élu évêque de Carthage, il dirige son Église pendant la persécution de Dèce et défend l’unité de l’Église dans son traité sur le sujet. Il est décapité en 258 sous Valérien.",
"Saint Janvier":"Janvier, évêque de Benévent, est arrêté en 305 pendant la persécution de Dioclétien alors qu’il visitait des chrétiens prisonniers. Il est décapité près de Pouzzoles. Naples l’a pour patron ; trois fois par an, la liquéfaction de son sang conservé attire une foule de fidèles.",
"Saint André Kim":"André Kim Tae-gon, né en 1821 en Corée, est baptêsé enfant. Envoyé à Macao pour se former, il devient le premier prêtre coréen en 1845. De retour, il prêche en secret et prépare l’arrivée de missionnaires. Arrêté, il est décapité en 1846, à vingt-cinq ans. Canonisé en 1984 avec 102 compagnons.",
"Saint Matthieu":"Matthieu, aussi appelé Lévi, est collecteur d’impôts à Capharnaüm quand Jésus l’appelle : « Suis-moi. » Il se lève et le suit. Il offre un repas à Jésus et à d’autres publicains. Il est l’auteur du premier Évangile du Nouveau Testament, destiné aux chrétiens venus du judaïsme.",
"Saint Maurice":"Maurice, chef de la légion thébaine, selon la tradition, refuse avec ses soldats chrétiens de persécuter d’autres chrétiens vers 287, en Valais. L’empereur Maximien les fait décimer, puis massacrer. Une abbaye est fondée sur le lieu, Saint-Maurice d’Agaune, et son culte se répand en Europe.",
"Saint Pio de Pietrelcina":"Francesco Forgione, né en 1887 à Pietrelcina, entre chez les capucins sous le nom de Pio. Prêtre en 1910, il s’installe à San Giovanni Rotondo, où il confesse des heures chaque jour et fonde un hôpital, la Casa Sollievo della Sofferenza. Il porte des stigmates pendant cinquante ans. Il meurt en 1968, canonisé en 2002.",
"Sainte Thècle":"Selon les Actes de Paul et Thècle, texte du IIe siècle, Thècle, jeune femme d’Iconium, est convertie par la prédication de Paul. Elle refuse le mariage, subit plusieurs supplices dont elle sort indemne, et devient une prédicatrice. Elle est honorée en Orient comme première martyre, et Maaloula, en Syrie, garde son souvenir.",
"Saints Côme et Damien":"Côme et Damien, frères jumeaux nés en Arabie, sont médecins en Cilicie et soignent sans demander de salaire. Arrêtés pendant la persécution de Dioclétien, ils sont décapités vers 287. Ils sont les patrons des médecins, des chirurgiens et des pharmaciens.",
"Saint Venceslas":"Venceslas, né vers 907, est duc de Bohême, élevé par sa grand-mère Ludmila. Il développe l’Église et rend la justice avec bonté. Son frère Boleslas, jaloux, l’invite à un banquet et le fait assassiner en 935. Patron de la Bohême et de la République tchèque.",
"Saints Michel, Gabriel et Raphaël":"Le 29 septembre, l’Église honore les trois archanges nommés dans la Bible : Michel, chef des armées célestes qui terrasse le mal, Gabriel, qui annonce à Marie la naissance de Jésus, et Raphaël, qui guide et guérit Tobie. Le Mont-Saint-Michel porte le nom du premier.",
"Saint Alphonse de Liguori":"Alphonse, né à Naples en 1696, est un brillant avocat. Après une défaite sur un procès important, il renonce au barreau et devient prêtre. Il fonde les Rédemptoristes pour prêcher aux pauvres des campagnes. Évêque de Sainte-Agathe-des-Goths, il écrit de la théologie morale et meurt en 1787, docteur de l’Église.",
"Saint Julien Eymard":"Pierre-Julien Eymard, né en 1811 à La Mure, en Isère, devient prêtre mariste. Il consacre sa vie à l’adoration de l’Eucharistie et fonde en 1856 la congrégation du Très-Saint-Sacrement. Il organise aussi des œuvres pour les enfants. Il meurt en 1868.",
"Sainte Lydie":"Lydie, marchande de pourpre à Philippes, en Macédoine, est la première personne convertie par Paul en Europe (Actes 16). Elle est baptêsée avec toute sa maison et accueille l’apôtre chez elle. Sa maison devient le premier lieu de réunion des chrétiens de la ville.",
"Dédicace de Sainte-Marie-Majeure":"La basilique Sainte-Marie-Majeure, à Rome, a été bâtie au Ve siècle, après le concile d’Éphèse qui proclame Marie Mère de Dieu. Une tradition raconte qu’une neige miraculeuse en aurait marqué l’emplacement un 5 août. C’est la plus grande église dédiée à Marie en Occident.",
"Transfiguration du Seigneur":"Sur une haute montagne, Jésus se transfigure devant Pierre, Jacques et Jean : son visage brille comme le soleil et ses vêtements deviennent blancs. Moïse et Élie lui apparaissent, et une voix proclame : « Celui-ci est mon Fils bien-aimé. » Cette fête annonce la gloire de la Résurrection.",
"Saint Gaétan":"Gaétan de Thiene, né en 1480 à Vicence, est juriste, puis prêtre. Il fonde à Rome l’Oratoire de l’Amour divin, puis, avec trois compagnons, les Théatins, des clercs réguliers voulant réformer le clergé. Il soutient aussi les pauvres de Venise et de Naples. Il meurt en 1547.",
"Saint Laurent":"Laurent, diacre du pape Sixte II à Rome, est chargé des biens de l’Église et des aumônes. Quand l’empereur Valérien exige le trésor de l’Église, il lui présente les pauvres. Il est mis à mort en 258, selon la tradition sur un gril. Rome l’honore avec une grande basilique.",
"Saint Hippolyte":"Hippolyte, prêtre et savant romain au début du IIIe siècle, écrit la Tradition apostolique, précieux témoin de la liturgie ancienne. Opposant au pape Calixte, il se fait élire antipape, mais est exilé en Sardaigne avec le pape Pontien et se réconcilie avec l’Église. Il meurt vers 235.",
"Assomption de la Vierge Marie":"Le 15 août, l’Église fête l’Assomption : à la fin de sa vie terrestre, Marie est élevée corps et âme dans la gloire de Dieu. La fête est célébrée depuis les premiers siècles ; Pie XII en proclame le dogme en 1950. En France, c’est un jour férié.",
"Saint Armel":"Armel, né vers 482 au pays de Galles, traverse la mer pour la Bretagne armoricaine, où il fonde un monastère près de Ploërmel. La légende lui attribue d’avoir maîtrisé un dragon avec son étole. Il meurt vers 552 ; Ploërmel garde son souvenir.",
"Saint Hyacinthe":"Hyacinthe, né vers 1185 en Pologne, rencontre Dominique à Rome et entre chez les dominicains. Il fonde des couvents en Pologne et prêche jusqu’à Kiev, en Prussée et au Danemark. Il meurt à Cracovie en 1257.",
"Sainte Hélène":"Hélène, née vers 248, est la mère de l’empereur Constantin. Devenue chrétienne, elle fait un pèlerinage à Jérusalem vers 326 et soutient la construction de basiliques à Bethléem et au mont des Oliviers. Une tradition lui attribue la découverte de la vraie Croix. Elle meurt vers 330.",
"Saint Jean Eudes":"Jean Eudes, né en 1601 en Normandie, entre à l’Oratoire de France. Il prêche de nombreuses missions populaires. Il fonde les eudistes pour former les prêtres et les Sœurs de Notre-Dame de Charité pour accueillir les femmes en difficulté. Il répand la dévotion aux Cœurs de Jésus et de Marie. Il meurt en 1680.",
"Saint Bernard":"Bernard, né vers 1090 près de Dijon, entre à Cîteaux en 1112 avec une trentaine de compagnons. Trois ans plus tard, il fonde Clairvaux. Sa parole influence Église et rois : il prêche la deuxième croisade et soutient la réforme. Il meurt en 1153 ; docteur de l’Église.",
"Saint Pie X":"Giuseppe Sarto, né en 1835 dans une famille pauvre de Vénétie, devient prêtre, évêque puis patriarche de Venise. Élu pape en 1903 sous le nom de Pie X, il encourage la communion fréquente et celle des enfants, le chant sacré et la formation des fidèles. Il meurt en 1914, à l’aube de la Grande Guerre.",
"Marie, Reine":"Le 22 août, une semaine après l’Assomption, l’Église honore Marie comme Reine du ciel et de la terre, couronnée par son Fils. Cette fête a été instituée par Pie XII en 1954. Elle exprime la confiance des chrétiens en la protection de Marie.",
"Sainte Rose de Lima":"Rose, née en 1586 à Lima, au Pérou, est célèbre pour sa beauté, mais elle choisit de se consacrer à Dieu et devient tertiaire dominicaine. Elle prie, jeûne et soigne des malades dans la maison de ses parents. Elle meurt en 1617 et est canonisée en 1671, première sainte du Nouveau Monde.",
"Saint Barthélemy":"Barthélemy est l’un des Douze, généralement identifié à Nathanaël, que Philippe amène à Jésus. Selon la tradition, il prêche en Inde et en Arménie, où il meurt martyr, écorché vif. On le représente souvent avec son propre couteau.",
"Sainte Monique":"Monique, née en 331 à Thagaste, épouse Patrice, un païen violent, et a trois enfants, dont Augustin. Elle prie pendant des années pour la conversion de son fils, le suit à Carthage, puis à Milan. Elle assiste à son baptême en 387 et meurt peu après à Ostie.",
"Martyre de saint Jean-Baptiste":"Jean-Baptiste reproche au roi Hérode Antipas d’avoir pris pour épouse Hérodiade, la femme de son frère. Emprisonné, il est décapité à la demande de sa fille Salomé, lors d’un banquet. Ses disciples enterrent son corps. Jean est ainsi le précurseur du Christ jusque dans sa mort.",
"Saint Fiacre":"Fiacre, moine irlandais, arrive en France vers 628 et obtient de l’évêque de Meaux, saint Faron, un terrain en Brie, à Breuil, où il vit en ermite et cultive un potager. Il accueille les pauvres et les pèlerins. Patron des jardiniers ; le mot « fiacre » vient de l’hôtel Saint-Fiacre, à Paris.",
"Saint Aristide":"Aristide d’Athènes, philosophe chrétien du IIe siècle, adresse à l’empereur Hadrien ou Antonin une Apologie pour défendre les chrétiens. Il montre que leur vie honnête et charitable témoigne de leur foi. Son texte est parmi les plus anciens du genre.",
"Saint Thierry":"Thierry, né près de Reims au Ve siècle, est formé par saint Rémi et devient abbé du monastère du Mont-d’Hor, près de Reims. Il guide de nombreux disciples par sa douceur. Il meurt vers 533.",
"Saint Martinien":"Martinien et son compagnon Processus sont, selon la tradition, les gardiens de la prison Mamertine de Rome où saint Pierre est détenu. Convertis par lui, ils sont baptêsés, puis mis à mort sous Néron. Leurs reliques sont conservées à Saint-Pierre de Rome.",
"Saint Thomas":"Thomas, surnommé le Jumeau, est l’un des Douze. Après la Résurrection, il doute et veut toucher les plaies du Christ. Jésus l’invite, et Thomas s’écrie : « Mon Seigneur et mon Dieu ! » Selon la tradition, il aurait porté l’Évangile jusqu’en Inde, où il serait mort martyr.",
"Saint Antoine-Marie Zaccaria":"Né à Crémone en 1502, Antoine-Marie Zaccaria est d’abord médecin. Devenu prêtre, il fonde à Milan les Barnabites, la congrégation de Saint-Paul, pour réformer les mœurs et la vie spirituelle. Il aime l’étude de saint Paul. Il meurt en 1539, à trente-six ans.",
"Saint Ulrich":"Ulrich, né en 890, devient évêque d’Augsbourg en 923. Quand les Hongrois assiègent la ville en 955, il en organise la défense, juste avant la victoire d’Otton Ier au Lechfeld. Il soigne les pauvres, reconstruit les églises et meurt en 973. Il est le premier saint canonisé officiellement par un pape, en 993.",
"Saint Henri":"Henri II, né en 973 en Bavière, devient roi de Germanie en 1002 puis empereur en 1014. Il soutient l’Église, fonde l’évêché de Bamberg et défend les monastères. Marié à Cunégonde, il gouverne avec piété et sens de la justice. Il meurt en 1024.",
"Saint Camille de Lellis":"Camille, né en 1550 en Italie, est un soldat joueur et violent. Converti vers vingt-cinq ans, il se met au service des malades dans les hôpitaux de Rome. Il fonde les Ministres des infirmes. Leur habit porte une grande croix rouge. Il meurt en 1614 ; patron des malades.",
"Saint Bonaventure":"Bonaventure, né vers 1221 à Bagnoregio, guéri enfant par les prières de saint François, devient franciscain et maître à Paris. Ministre général de l’ordre, il en écrit la vie de saint François. Créé cardinal, il meurt en 1274 pendant le concile de Lyon. On l’appelle le « docteur séraphique ».",
"Notre-Dame du Mont-Carmel":"Le 16 juillet, l’Église fête Notre-Dame du Mont-Carmel, honorée par l’ordre des carmélites, né au mont Carmel, en Terre sainte. Une tradition raconte qu’en 1251, Marie serait apparue à Simon Stock et lui aurait remis le scapulaire, signe de protection que portent encore de nombreux fidèles.",
"Saint Arsène":"Arsène, né vers 354 à Rome, est précepteur des fils de l’empereur Théodose. Il quitte la cour vers 394 pour le désert de Scété, en Égypte, où il vit dans le silence et la prière. Il laisse un enseignement très bref : « Fuis, tais-toi, reste en paix. » Il meurt vers 450.",
"Saint Victor":"Victor, soldat romain de Marseille, est arrêté vers 290 pour avoir confessé sa foi devant l’empereur. Refusant de sacrifier aux idoles, il subit de nombreux supplices et est décapité. L’abbaye Saint-Victor, fondée au Ve siècle sur son tombeau, devient un grand centre monastique.",
"Sainte Brigitte":"Brigitte, née en 1303 en Suède, épouse Ulf Gudmarsson et a huit enfants. Veuve, elle fonde l’ordre du Saint-Sauveur, dit des brigittines, et s’installe à Rome, où elle écrit ses Révélations. Elle presse les papes de revenir d’Avignon. Elle meurt en 1373 ; patronne de l’Europe depuis 1999.",
"Saint Jacques":"Jacques, fils de Zébédée et frère de Jean, est l’un des premiers appelés au bord du lac de Galilée. Il assiste à la Transfiguration. Premier des Douze à mourir martyr, il est décapité vers 44 par Hérode Agrippa. Selon la tradition, son corps repose à Compostelle, but de pèlerinage.",
"Sainte Nathalie":"Nathalie, à Cordoue au IXe siècle, est épousée à Aurèle, un chrétien qui cache sa foi. Ensemble, ils visitent les chrétiens emprisonnés par les musulmans. Arrêtés, ils sont décapités en 852. Ils comptent parmi les « martyrs de Cordoue ».",
"Saint Samson":"Samson, né vers 486 au pays de Galles, est moine avant de traverser la mer pour la Bretagne armoricaine. Il fonde le monastère de Dol, dont il devient évêque, et assiste à un concile à Paris. Il meurt vers 565 ; Dol-de-Bretagne l’honore comme son fondateur.",
"Sainte Marthe":"Marthe de Béthanie, sœur de Marie et de Lazare, accueille Jésus chez elle. Affairée au service, elle se plaint de sa sœur ; Jésus lui répond avec douceur. Après la mort de Lazare, elle confesse sa foi : « Tu es le Christ. » Une légende la dit venue en Provence, à Tarascon.",
"Sainte Juliette":"Juliette, veuve de Césarée de Cappadoce, est dépossédée de ses biens par un voisin puissant. Elle le conduit devant le juge, qui découvre qu’elle est chrétienne. Elle refuse de sacrifier aux dieux et meurt martyre vers 303.",
"Saint Justin":"Justin, né vers 100 en Palestine, cherche la vérité chez les philosophes avant de se convertir au christianisme. Il ouvre une école à Rome et écrit des Apologies pour défendre les chrétiens devant l’empereur. Dénoncé, il est décapité vers 165.",
"Sainte Blandine":"Blandine, esclave à Lyon, est arrêtée en 177 avec d’autres chrétiens sous Marc Aurèle. Malgré sa fragilité, elle soutient ses compagnons et résiste à de longues tortures dans l’amphithéâtre. Elle est finalement mise à mort. Les martyrs de Lyon sont le premier témoignage chrétien en Gaule.",
"Saint Charles Lwanga":"Charles Lwanga, né vers 1860 en Ouganda, est l’un des pages du roi Mwanga. Chef des jeunes chrétiens de la cour, il les protège. Le roi, furieux de leur refus de céder à ses exigences, les fait brûler vifs le 3 juin 1886, avec une vingtaine de compagnons. Canonisés en 1964.",
"Sainte Clotilde":"Clotilde, princesse burgonde née vers 475, épouse le roi des Francs Clovis. Chrétienne fervente, elle l’invite à la foi et assiste à son baptême à Reims. Veuve en 511, elle se retire à Tours, près du tombeau de saint Martin, et vit de prière et de charité jusqu’à sa mort en 545.",
"Saint Boniface":"Winfrid, moine anglo-saxon né vers 675, prend le nom de Boniface. Envoyé par le pape en Germanie, il évangélise la région, fonde des monastères et abat, selon la tradition, le chêne sacré de Donar à Geismar. Il est tué en 754 par des bandits en Frise. Apôtre de la Germanie.",
"Saint Norbert":"Norbert, né vers 1075 en Rhénanie, mène une vie de cour avant de se convertir après un orage. Devenu prêtre, il fonde en 1120 Prémontré, près de Laon, en Picardie, l’ordre des Prémontrés. Archevêque de Magdebourg, il meurt en 1134.",
"Saint Médard":"Médard, né vers 456 à Salency, dans l’Oise, devient évêque de Noyon et de Vermand. Il se montre proche des pauvres et reste associé à la tradition de la rosière de Salency. Il meurt vers 560. Le dicton « Saint-Médard pluvieux » vient de sa fête, au début de l’été.",
"Saint Landry":"Landry, évêque de Paris vers 650, est connu pour sa charité : pendant une famine, il vend les biens de l’Église pour nourrir les pauvres. On lui attribue la fondation du premier hôpital de Paris, l’Hôtel-Dieu. Il meurt vers 661.",
"Saint Barnabé":"Barnabé, un Juif de Chypre, vend un champ pour en donner le prix aux apôtres. Il présente Paul, converti, à la communauté de Jérusalem, puis l’accompagne dans son premier voyage missionnaire. Ils se séparent plus tard. La tradition le dit mort martyr à Chypre.",
"Saint Élisée":"Élisée, prophète d’Israël au IXe siècle avant Jésus, est choisi par Élie, qui lui jette son manteau. Il lui succède, accomplit des guérisons, dont celle du général syrien Naaman, et conseille les rois d’Israël. Son histoire est racontée dans le Deuxième livre des Rois.",
"Sainte Germaine":"Germaine Cousin, née vers 1579 à Pibrac, près de Toulouse, est infirme d’une main et maltraitée par sa belle-mère. Bergère, elle prie chaque jour et partage son pain avec plus pauvre qu’elle. Elle meurt vers 1601, à vingt-deux ans. Canonisée en 1867.",
"Saint Jean-François Régis":"Jean-François Régis, né en 1597 dans l’Aude, entre chez les jésuites. Missionnaire dans le Vivarais et le Velay, il visite les villages de montagne, soigne les malades et réconcilie les familles. Il meurt d’épuisement en 1640 à La Louvesc.",
"Saint Hervé":"Hervé, né aveugle vers 520 en Bretagne, passe sa vie dans la prière et l’enseignement des enfants. Il fonde une petite communauté près de Lanhouarneau. La tradition lui attribue plusieurs guérisons. Il est honoré comme le patron des aveugles et des bardes bretons.",
"Saint Romuald":"Romuald, né vers 951 à Ravenne, quitte la vie noble après un drame familial et entre chez les bénédictins. Vers 1012, il fonde l’ermitage de Camaldoli, d’où naîtra l’ordre des camaldules, qui allie vie solitaire et communautaire. Il meurt en 1027.",
"Saint Silvère":"Silvère, fils du pape Hormisdas, est élu pape en 536 sous la pression du roi des Goths. Accusé de trahison par l’impératrice Théodora, il est exilé à Palmarola, île de la mer Tyrrhénienne, où il meurt en 537.",
"Saint Louis de Gonzague":"Louis, né en 1568 dans une famille princière de Lombardie, renonce à son titre pour entrer chez les jésuites. Quand la peste frappe Rome en 1591, il soigne les malades, contracte la maladie et meurt à vingt-trois ans. Patron de la jeunesse.",
"Saint Paulin de Nole":"Paulin, né vers 354 à Bordeaux, est un riche sénateur romain. Après la mort de son fils, il se convertit, vend ses biens et s’installe à Nole, en Campanie, près du tombeau de saint Félix. Évêque de Nole, il laisse des poèmes et des lettres. Il meurt en 431.",
"Sainte Édeltrude":"Étheldrède, princesse anglo-saxonne née vers 636, est mariée deux fois mais garde sa vocation religieuse. Elle fonde le monastère d’Ely, dont elle est abbesse, et vit avec une grande simplicité. Elle meurt en 679, honorée comme une des premières saintes anglaises.",
"Saint Prosper":"Prosper d’Aquitaine, né vers 390, est un laïc cultivé qui défend la doctrine de la grâce d’Augustin contre des contradicteurs en Gaule. Il écrit des poèmes et une chronique, et s’installe à Rome, où il aide le pape Léon. Il meurt vers 455.",
"Saint Anthelme":"Anthelme, né en 1107 en Savoie, entre chez les chartreux et devient prieur de la Grande Chartreuse, qu’il reconstruit après une avalanche. Évêque de Belley en 1163, il se montre juste et désintéressé, et n’hésite pas à s’opposer aux puissants. Il meurt en 1178.",
"Saint Irénée":"Irénée, né vers 130 à Smyrne, a connu Polycarpe, disciple de l’apôtre Jean. Prêtre puis évêque de Lyon, il écrit Contre les hérésies pour défendre la foi reçue des apôtres. Il œuvre pour la paix entre les Églises. Il meurt vers 202.",
"Saint Martial":"Martial est, selon la tradition, le premier évêque de Limoges, venu évangéliser le Limousin au IIIe siècle. Il fonde une communauté chrétienne autour de Limoges. Son tombeau devient l’un des plus grands lieux de pèlerinage du Moyen Âge, l’abbaye Saint-Martial.",
"Saint Joseph travailleur":"Le 1er mai, l’Église honore Joseph, charpentier de Nazareth, comme modèle des travailleurs. Cette fête a été instituée par Pie XII en 1955 pour donner un sens chrétien à la fête du Travail. Elle rappelle que Jésus a grandi dans l’atelier d’un artisan.",
"Saint Athanase":"Athanase, né vers 296 à Alexandrie, assiste au concile de Nicée comme jeune diacre, puis devient évêque d’Alexandrie en 328. Il défend sans relâche la divinité du Christ contre Arius et subit cinq exils. Il meurt en 373, docteur de l’Église.",
"Saints Philippe et Jacques":"Philippe, originaire de Bethsaïde, est l’un des premiers disciples de Jésus et lui amène Nathanaël. Jacques, appelé « le Mineur », devient évêque de Jérusalem ; il est lapidé vers 62. L’Église les fête ensemble parce que leurs reliques furent rassemblées à Rome.",
"Saint Florian":"Florian, officier romain dans le Norique, actuelle Autriche, est arrêté en 304 pour avoir refusé de persécuter les chrétiens. Il est jeté dans la rivière Enns avec une pierre au cou. Il est devenu le patron des pompiers et de l’Autriche.",
"Sainte Gisèle":"Gisèle, née vers 985, est la sœur de l’empereur Henri II. Elle épouse Étienne Ier, premier roi de Hongrie, et l’aide à christianiser le pays. Veuve, elle se retire comme abbesse à Niedernburg, près de Passau, où elle meurt vers 1060.",
"Saint Pacôme":"Pacôme, né vers 292 en Égypte, est soldat avant de se convertir après avoir été secouru par des chrétiens. Il fonde vers 320 à Tabennesi les premières communautés monastiques réglées par une règle, la vie cénobitique. Il meurt en 346.",
"Sainte Solange":"Solange, jeune bergère du Berry, serait née vers 870 et morte martyre vers 880, après avoir refusé les avances d’un seigneur local. Son tombeau devient un lieu de pèlerinage près de Bourges. Elle est la patronne du Berry.",
"Saint Matthias":"Après la mort de Judas, les onze apôtres choisissent un douzième témoin qui a suivi Jésus depuis son baptême. Le sort tombe sur Matthias (Actes 1). Selon la tradition, il prêche ensuite en Judée puis en Cappadoce ou en Éthiopie, et meurt martyr.",
"Saint Honoré":"Honoré, né à Port-le-Grand, près d’Abbeville, devient évêque d’Amiens vers la fin du VIe siècle et meurt vers 600. Il est devenu le patron des boulangers, et la cathédrale d’Amiens lui consacre un portail.",
"Saint Pascal":"Pascal Baylon, né en 1540 en Aragon, est berger puis frère lai chez les franciscains. Il consacre de longues heures à prier devant l’Eucharistie, tout en gardant la porte du couvent et accueillant les pauvres. Il meurt en 1592. Patron des œuvres eucharistiques.",
"Saint Éric":"Éric IX, roi de Suède de 1156 à 1160, favorise l’Église et fait respecter la justice. La tradition dit qu’il aurait entrepris une expédition en Finlande pour diffuser le christianisme. Le 18 mai 1160, il est assassiné par des opposants à la sortie de la messe. Il est le patron de Stockholm.",
"Saint Yves":"Yves Hélory de Kermartin, né en 1253 près de Tréguier, étudie le droit à Paris et Orléans, puis devient juge ecclésiastique et prêtre. Il défend les pauvres sans leur faire payer, d’où son surnom d’« avocat des pauvres ». Il meurt en 1303. Patron des avocats et de la Bretagne.",
"Saint Bernardin":"Bernardin de Sienne, né en 1380, soigne les malades pendant la peste puis devient franciscain. Il prêche dans toute l’Italie en appelant à la paix entre les villes. Il répand la dévotion au nom de Jésus, représenté par le monogramme IHS. Il meurt en 1444.",
"Saint Constantin":"Constantin Ier, empereur de 306 à 337, met fin aux persécutions avec l’édit de Milan, en 313. Il convoque le concile de Nicée en 325, déplace la capitale à Constantinople et soutient la construction d’églises. Il est baptisé sur son lit de mort. L’Église orthodoxe le fête avec sa mère Hélène.",
"Saint Didier":"Didier, évêque de Langres, est tué par des envahisseurs en 411 alors qu’il défend son troupeau. Selon la tradition, il aurait choisi de rester auprès des siens malgré le danger. Son culte se répand en Champagne et en Bourgogne.",
"Saint Donatien":"Donatien et son frère Rogatien vivent à Nantes, vers la fin du IIIe siècle. Donatien est converti, Rogatien encore catéchumène quand la persécution de Maximien les arrête. Ils refusent de renier leur foi et sont décapités vers 299. Nantes honore les « Enfants nantais ».",
"Saint Philippe Néri":"Né à Florence en 1515, Philippe Néri vient à Rome, où il soigne les pauvres et rassemble des jeunes pour prier, lire la Bible et chanter. Cela donne l’Oratoire. Connu pour sa joie et son humour, il devient conseiller de papes. Il meurt en 1595.",
"Saint Augustin de Cantorbéry":"Moine romain, Augustin est envoyé en 596 par le pape Grégoire le Grand pour évangéliser l’Angleterre. Il arrive dans le Kent en 597, où le roi Ethelbert, dont l’épouse est chrétienne, l’accueille et se fait baptiser. Premier archevêque de Cantorbéry, il meurt vers 604.",
"Saint Germain":"Germain, né vers 496 près d’Autun, devient évêque de Paris en 555. Il conseille le roi Childebert Ier, qui fonde à sa demande l’abbaye de Saint-Vincent, aujourd’hui Saint-Germain-des-Prés. Il prend la défense des pauvres et des prisonniers. Il meurt en 576.",
"Visitation de la Vierge Marie":"Après l’Annonciation, Marie part en hâte voir sa cousine Élisabeth, enceinte de Jean-Baptiste. À son arrivée, l’enfant tressaille dans le sein d’Élisabeth, et Marie chante le Magnificat. Cette fête, au 31 mai, célèbre la rencontre des deux mères.",
"Saint Hugues":"Hugues, né en 1053 près de Valence, devient évêque de Grenoble à vingt-sept ans et réforme son diocèse. En 1084, il accueille Bruno et ses compagnons et leur donne le massif de la Chartreuse, où naît l’ordre des chartreux. Il meurt en 1132.",
"Saint François de Paule":"Né en 1416 en Calabre, François se retire dès l’adolescence dans une grotte près de Paola. Des disciples le rejoignent : c’est l’ordre des Minimes, qui vit dans une grande humilité. Appelé en France par Louis XI en 1483, il s’installe près de Tours et y meurt en 1507.",
"Saint Richard":"Richard de Wych, né en 1197, étudie à Oxford et Paris, devient chancelier de l’archevêché de Cantorbéry, puis évêque de Chichester en 1245. Il s’oppose au roi Henri III pour défendre l’Église, soutient les pauvres et visite ses paroisses. Il meurt en 1253.",
"Saint Isidore":"Isidore, né vers 560 à Séville, succède à son frère Léandre comme évêque. Savant, il rédige les Étymologies, grande encyclopédie qui transmet le savoir antique au Moyen Âge. Il préside aussi le concile de Tolède en 633. Il meurt en 636 ; docteur de l’Église.",
"Saint Vincent Ferrier":"Dominicain né à Valence en 1350, Vincent Ferrier est un célèbre prédicateur. Il parcourt l’Espagne, la France, l’Italie et la Suisse en appelant à la conversion, souvent suivi de foules. Il s’investit pour mettre fin au Grand Schîsme. Il meurt à Vannes en 1419.",
"Saint Jean-Baptiste de La Salle":"Né à Reims en 1651, Jean-Baptiste de La Salle est chanoine. Frappé par l’abandon des enfants pauvres, il renonce à sa fortune et fonde les Frères des écoles chrétiennes, qui enseignent gratuitement en français. Il invente des méthodes pédagogiques. Il meurt en 1719 ; patron des éducateurs.",
"Sainte Julie":"Julie Billiart, née en 1751 à Cuvilly, dans l’Oise, devient paralysée à trente ans et reste clouée au lit pendant vingt-deux ans. Guérie en 1804, elle fonde avec Françoise Blin de Bourdon les Sœurs de Notre-Dame de Namur pour éduquer les enfants pauvres. Elle meurt en 1816.",
"Saint Fulbert":"Fulbert, né vers 960, est évêque de Chartres de 1006 à sa mort en 1028. Il fait de l’école cathédrale un grand centre intellectuel et reconstruit la cathédrale après l’incendie de 1020. Il est aussi un ardent défenseur du culte de la Vierge.",
"Saint Stanislas":"Stanislas, né en 1030 près de Cracovie, devient évêque de Cracovie en 1072. Il reproche à voix haute au roi Boleslas II sa conduite violente. Le roi le fait tuer en 1079, pendant qu’il célébrait la messe. Il est le patron de la Pologne.",
"Saint Jules":"Jules Ier, pape de 337 à 352, défend l’évêque Athanase d’Alexandrie contre les ariens et affirme le rôle de Rome dans les questions de foi. Il fait bâtir plusieurs églises dans la ville. Il meurt en 352.",
"Sainte Ida":"Ida de Boulogne, née vers 1040, épouse Eustache II de Boulogne et devient la mère de Godefroy de Bouillon, futur chef de la première croisade. Veuve, elle se consacre aux pauvres et fonde plusieurs abbayes. Elle meurt en 1113.",
"Saint Anicet":"Anicet, originaire de Syrie, devient pape vers 155 et le reste une dizaine d’années. Il reçoit à Rome l’évêque Polycarpe de Smyrne pour discuter de la date de Pâques ; ils ne tombent pas d’accord mais restent en communion. Il meurt vers 166.",
"Saint Parfait":"Parfait, prêtre de Cordoue, est arrêté en 850 pour avoir refusé de renier le Christ face à des musulmans qui l’interrogeaient. Il est mis à mort peu après, le 18 avril. Il est le premier des « martyrs de Cordoue » du IXe siècle.",
"Sainte Emma":"Emma, née vers 980 en Carinthie, est mariée à un comte. Après la mort de son époux et de ses fils, elle consacre sa fortune aux œuvres charitables, fonde un monastère de bénédictines à Gurk et soutient de nombreux pauvres. Elle meurt en 1045.",
"Saint Anselme":"Anselme, né en 1033 à Aoste, devient moine au Bec, en Normandie, puis archevêque de Cantorbéry en 1093. Son raisonnement sur l’existence de Dieu, l’argument ontologique, marque la philosophie. Il s’oppose aux rois d’Angleterre pour défendre la liberté de l’Église. Il meurt en 1109.",
"Sainte Opportune":"Opportune, née en Normandie au VIIIe siècle, est la sœur de l’évêque de Sées. Elle devient abbesse du monastère d’Almenêches et se distingue par sa douceur. Elle meurt vers 770. Paris lui a consacré une église.",
"Saint Fidèle":"Fidèle de Sigmaringen, né en 1577, est d’abord avocat, défenseur des pauvres. Il devient capucin et prêche en Suisse. En 1622, il est tué par des protestants à Seewis après avoir parlé de sa foi. Premier martyr de la Propagande de la foi.",
"Saint Marc":"Marc, évangéliste, est compagnon de Pierre et de Paul. Il est l’auteur du plus ancien des quatre Évangiles, écrit vers 70. La tradition fait de lui le fondateur de l’Église d’Alexandrie, où il serait mort martyr. Ses reliques sont conservées à Venise, dont il est le patron.",
"Sainte Zita":"Zita, née vers 1218 près de Lucques, entre à douze ans comme servante dans une famille. Elle accomplit ses tâches avec fidélité et partage son pain avec les pauvres. Elle meurt en 1272, honorée depuis comme patronne des domestiques.",
"Saint Pierre Chanel":"Pierre Chanel, né en 1803 dans l’Ain, est prêtre mariste. En 1837, il est envoyé à Futuna, dans le Pacifique. Il apprend la langue et soigne les malades, mais le roi Niuliki, inquiet de voir ses sujets se convertir, le fait tuer en 1841. Il est le premier martyr d’Océanie.",
"Sainte Catherine de Sienne":"Née en 1347 à Sienne, Catherine Benincasa devient tertiaire dominicaine. Elle soigne les malades et écrit aux grands de ce monde. Elle presse le pape Grégoire XI de quitter Avignon pour Rome, ce qu’il fait en 1377. Elle meurt en 1380 ; docteur de l’Église depuis 1970.",
"Saint Pie V":"Michele Ghislieri, né en 1504, entre chez les dominicains et devient inquisiteur, puis pape en 1566. Il applique le concile de Trente : catéchisme, missel, bréviaire. Il organise la Sainte Ligue qui remporte la victoire de Lépante en 1571. Il meurt en 1572.",
"Saint Aubin":"Aubin, né vers 469 en Bretagne, devient moine puis abbé de Tintillac, et évêque d’Angers en 529. Il est connu pour racheter des captifs et pour avoir participé au concile d’Orléans de 538. Il meurt vers 550. Angers l’honore comme son grand évêque.",
"Saint Charles le Bon":"Charles le Bon, comte de Flandre, se montre juste et proche des pauvres. Lors de la famine de 1125, il fait distribuer du pain et lutte contre les abus des puissants. Le 2 mars 1127, il est assassiné par des conjurés dans l’église Saint-Donatien de Bruges, alors qu’il priait.",
"Saint Guénolé":"Guénolé, né en Armorique vers 460, se forme auprès de l’abbé Budoc. Vers 485, il fonde l’abbaye de Landevennec, dans le Finistère, qui deviendra l’un des grands centres monastiques de Bretagne. Il meurt vers 532.",
"Saint Casimir":"Casimir, né en 1458, est le fils du roi de Pologne Casimir IV. Il refuse de mener une guerre injuste en Hongrie, vit avec austérité et prière malgré sa position royale, et meurt de la tuberculose à vingt-cinq ans, en 1484. Il est le patron de la Pologne et de la Lituanie.",
"Sainte Colette":"Née en 1381 à Corbie, dans la Somme, Colette devient recluse puis réformatrice des clarisses : elle revient à la pauvreté et à la règle primitive de sainte Claire et fonde de nombreux monastères. Elle meurt à Gand en 1447 et est canonisée en 1807.",
"Sainte Perpétue et sainte Félicité":"À Carthage, en 203, la jeune noble Perpétue, mère d’un nourrisson, et son esclave Félicité, enceinte, sont arrêtées avec d’autres catéchumènes. Condamnées aux bêtes dans l’arène, elles meurent martyres. Perpétue a laissé un récit de sa prison, l’un des plus anciens écrits chrétiens de femme.",
"Saint Jean de Dieu":"João Cidade, né au Portugal en 1495, est soldat puis libraire. Bouleversé par un sermon, il traverse une crise, est cru fou et interné. Il se consacre ensuite aux malades de Grenade et fonde un hôpital, origine de l’ordre hospitalier. Il meurt en 1550 ; patron des malades et des hôpitaux.",
"Sainte Françoise Romaine":"Françoise, née à Rome en 1384, est mariée et mère de famille. Pendant les guerres et la peste, elle soigne les malades et distribue du pain. En 1425, elle fonde les oblates de Tor de’ Specchi, une communauté de femmes sans cloître. Elle meurt en 1440 ; patronne des automobilistes.",
"Saint Rodrigue":"Rodrigue, prêtre de Cabra, près de Cordoue, est dénoncé par son propre frère musulman. Arrêté sous l’émir Abd al-Rahman II, il est décapité en 857 avec un compagnon, Salomon. Il compte parmi les « martyrs de Cordoue » du IXe siècle.",
"Sainte Mathilde":"Mathilde, née vers 895 en Saxe, épouse le roi de Germanie Henri Ier, l’Oiseleur, et devient la mère d’Otton Ier. Pieuse et généreuse, elle fonde plusieurs monastères, dont Quedlinburg. Après la mort de son époux, elle subit l’hostilité de ses fils avant de se réconcilier avec eux. Elle meurt en 968.",
"Sainte Louise de Marillac":"Née en 1591 à Paris, Louise de Marillac est veuve à trente-quatre ans. Guidée par Vincent de Paul, elle forme des jeunes femmes au service des pauvres et fonde avec lui, en 1633, les Filles de la Charité. Elle meurt en 1660 ; patronne des travailleurs sociaux.",
"Saint Patrick":"Né en Grande-Bretagne romaine vers 385, Patrick est enlevé à seize ans et réduit en esclavage en Irlande. Il s’évade, puis revient comme évêque évangéliser l’île, malgré les dangers. La tradition dit qu’il utilisa le trèfle pour expliquer la Trinité. Il meurt vers 461 ; patron de l’Irlande.",
"Saint Cyrille de Jérusalem":"Cyrille devient évêque de Jérusalem vers 350. Ses catéchèses aux futurs baptisés, expliquant le Credo et les sacrements, sont restées célèbres. Pris dans les querelles de l’arianisme, il est trois fois exilé, puis revient. Il meurt en 386 ; docteur de l’Église.",
"Sainte Léa":"Léa est une veuve romaine du IVe siècle, disciple de Jérôme. Après la mort de son mari, elle vend ses biens et se retire dans une vie de prière et de pénitence, entourée d’autres femmes. Jérôme fait son éloge dans ses lettres.",
"Saint Turibio de Mogrovejo":"Turibio, né en 1538 en Espagne, est juriste et professeur quand Philippe II le nomme archevêque de Lima. Pendant vingt-cinq ans, il parcourt à pied et à cheval son immense diocèse, apprend les langues indigènes, fonde des écoles et un séminaire. Il meurt en 1606.",
"Annonciation du Seigneur":"Neuf mois avant Noël, l’ange Gabriel est envoyé à Nazareth annoncer à Marie qu’elle sera la mère du Sauveur. Elle répond : « Voici la servante du Seigneur ; que tout m’advienne selon ta parole. » Cette fête célèbre le commencement de l’Incarnation.",
"Saint Gontran":"Gontran, petit-fils de Clovis, devient roi des Burgondes en 561 et règne à Chalon-sur-Saône. Il se montre pieux, soutient l’Église et protège ses neveux Childebert et Clotaire II. Il fonde l’abbaye de Saint-Marcel. Il meurt en 592.",
"Sainte Gwladys":"Gwladys est une princesse galloise du Ve siècle, fille du roi Brychan et mère de saint Cadoc. Après une vie de famille agitée, elle se retire avec son époux Gundleus dans une vie d’ermitage près de Newport, au pays de Galles.",
"Saint Amédée":"Amédée IX, né en 1435, devient duc de Savoie malgré une santé fragile, à trente ans. Il gouverne avec bonté, soulage les pauvres et lutte contre les abus. Épuisé par la maladie, il confie le pouvoir à son épouse Yolande de France et meurt en 1472.",
"Saint Benjamin":"Benjamin, diacre perse, est emprisonné pour sa foi sous le roi Yazdegerd Ier. Libéré avec l’interdiction de prêcher, il refuse de se taire. Torturé à nouveau, il meurt martyr vers 424.",
"Marie, Mère de Dieu":"Le 1er janvier, huitième jour après Noël, l’Église honore Marie. En 431, le concile d’Éphèse proclame qu’elle est Théotokos, « Mère de Dieu », pour affirmer que son fils Jésus est vraiment Dieu. C’est aussi la journée mondiale de la paix.",
"Saint Basile":"Né vers 330 en Cappadoce, Basile de Césarée étudie à Athènes, puis fonde des communautés monastiques. Évêque de Césarée en 370, il défend la foi de Nicée contre l’arianisme et fait bâtir un vaste lieu d’accueil pour les pauvres et les malades. Il meurt en 379. Docteur de l’Église.",
"Saint Odilon":"Odilon, né en Auvergne vers 962, devient abbé de Cluny en 994 et le reste plus de cinquante ans. Vers 998, il institue à Cluny la commémoration de tous les défunts, le 2 novembre, bientôt adoptée par toute l’Église. Il agit aussi pour la « paix de Dieu ». Il meurt en 1049.",
"Saint Édouard":"Édouard le Confesseur, roi d’Angleterre de 1042 à 1066, est connu pour sa piété et sa douceur. Il fait reconstruire l’abbaye de Westminster, où il est enterré. Il meurt le 5 janvier 1066, quelques jours après la consacration de l’abbaye.",
"Saint Mélaine":"Mélaine, né vers 460 près de Vannes, devient évêque de Rennes au début du VIe siècle. Il participe au concile d’Orléans de 511, convoqué par le roi Clovis, et reste proche du pouvoir franc. Il meurt vers 530. Rennes l’honore comme l’un de ses grands évêques.",
"Saint Raymond":"Raymond de Peñafort, né vers 1175 près de Barcelone, est juriste avant de devenir dominicain. Le pape Grégoire IX lui confie la mise en ordre du droit de l’Église : ce sera le recueil des Décrétales. Maître général des dominicains, il soutient la mission auprès des musulmans. Il meurt en 1275.",
"Saint Lucien":"Lucien d’Antioche, prêtre et savant, fonde une école biblique à Antioche et travaille à une révision du texte grec de la Bible. Arrêté sous l’empereur Maximin, il meurt martyr à Nicomédie en 312, après avoir confessé sa foi devant ses juges.",
"Sainte Alix":"Alix Le Clerc, née en 1576 en Lorraine, mène d’abord une jeunesse mondaine. Touchée par une expérience spirituelle, elle fonde avec le père Pierre Fourier une congrégation d’enseignantes, les chanoinesses de Notre-Dame, pour instruire gratuitement les filles. Elle meurt en 1622.",
"Saint Guillaume":"Guillaume de Donjeon, né vers 1155 dans le Nivernais, est chanoine puis moine, avant de devenir archevêque de Bourges en 1200. Il prend soin des pauvres, prêche sans relâche et réforme son clergé. Il meurt en 1209 ; sa tombe, dans la cathédrale de Bourges, attire de nombreux pèlerins.",
"Sainte Tatiana":"Selon la tradition, Tatiana est une jeune Romaine du IIIe siècle, diaconesse de l’Église, qui refuse d’honorer les idoles. Elle subit de nombreux supplices avant d’être mise à mort sous l’empereur Alexandre Sévère. Elle est très vénérée en Orient, notamment en Russie.",
"Saint Hilaire":"Hilaire, né vers 315 à Poitiers dans une famille païenne, se convertit en lisant la Bible. Élu évêque de Poitiers vers 350, il défend la divinité du Christ contre l’arianisme et est exilé en Orient. Ses écrits en font un docteur de l’Église. Il meurt vers 367 ; Martin fut son disciple.",
"Sainte Nina":"Nino, originaire de Cappadoce, arrive en Géorgie au début du IVe siècle. Selon la tradition, elle guérit des malades par la prière, conduit la reine à la foi, puis le roi Mirian. La Géorgie devient chrétienne vers 337. On la surnomme « l’égale des apôtres ».",
"Saint Rémi":"Rémi, né vers 437, devient évêque de Reims à vingt-deux ans. Il accompagne le roi des Francs, Clovis, vers la foi chrétienne et le baptise à la fin du Ve siècle, ce qui marque l’histoire de la France. Il meurt vers 533. Reims garde son tombeau dans la basilique Saint-Rémi.",
"Saint Marcel":"Marcel Ier est élu pape en 308, après une longue vacance du siège, au temps des persécutions. Il réorganise l’Église de Rome, mais sa sévérité envers ceux qui avaient renié leur foi provoque des troubles. Exilé par l’empereur Maxence, il meurt en 309.",
"Saint Antoine le Grand":"Né vers 251 en Égypte, Antoine entend un jour l’Évangile « Va, vends ce que tu as » et donne tous ses biens. Il se retire au désert, d’abord seul puis entouré de disciples, ce qui fait de lui le père du monachisme. Il meurt en 356, à près de cent cinq ans.",
"Sainte Prisca":"Prisca, ou Priscille, est une jeune Romaine martyre, probablement au IIIe siècle. Une tradition ancienne la dit âgée de treize ans. Son culte est attesté à Rome dès l’Antiquité : une église lui est consacrée sur l’Aventin.",
"Saint Marius":"Marius, père de famille venu de Perse, arrive à Rome avec son épouse Marthe et leurs fils Audifax et Abachum pour prier sur les tombeaux des martyrs. Sous l’empereur Claude II, vers 270, toute la famille est arrêtée et subit le martyre.",
"Saint Sébastien":"Sébastien, officier de la garde de l’empereur Dioclétien, réconforte en secret les chrétiens emprisonnés. Découvert, il est attaché à un poteau et percé de flèches, puis soigné par une veuve, Irène. Il retourne témoigner devant l’empereur et est battu à mort vers 288. Patron des archers.",
"Saint Vincent":"Vincent, diacre de l’évêque de Saragosse, est arrêté sous Dioclétien et conduit à Valence, où il subit de nombreux supplices et meurt vers 304 sans renier sa foi. Son culte se répand en Espagne et en Gaule. Il est le patron des vignerons, fêté chaque 22 janvier en Bourgogne.",
"Saint Barnard":"Barnard, né vers 778, est d’abord soldat de Charlemagne avant de fonder l’abbaye d’Ambronay, dans l’Ain. Devenu archevêque de Vienne en 810, il se montre fidèle à l’empereur Louis le Pieux, puis se retire. Il meurt en 842.",
"Conversion de saint Paul":"Saul de Tarse persécute les premiers chrétiens. Vers l’an 36, sur la route de Damas, une lumière l’aveugle et une voix lui demande pourquoi il le persécute. Baptêsé par Ananie, il recouvre la vue et devient Paul, l’apôtre des nations, qui fonde des communautés dans tout le monde grec.",
"Sainte Paule":"Paule, noble Romaine née en 347, est veuve à trente-trois ans. Disciple de Jérôme, elle l’accompagne à Bethléem, où elle fonde un monastère d’hommes et un de femmes, et l’aide dans l’étude de la Bible. Elle meurt en 404, ayant donné presque tous ses biens aux pauvres.",
"Sainte Angèle":"Angèle Merici, née vers 1474 près du lac de Garde, se consacre à éduquer les filles. En 1535 à Brescia, elle fonde la Compagnie de Sainte-Ursule : des femmes consacrées qui vivent dans le monde sans clôture. Ce sont les futures ursulines. Elle meurt en 1540.",
"Saint Gildas":"Gildas le Sage, né vers 500 en Bretagne insulaire, est moine et écrivain. Dans De excidio Britanniae, il dénonce les fautes des rois et du clergé de son temps. Il passe en Armorique et fonde l’abbaye de Rhuys, dans le Morbihan. Il meurt vers 570.",
"Sainte Martine":"Martine est une jeune Romaine du IIIe siècle. Selon les actes de son martyre, elle refuse de sacrifier aux idoles et subit de nombreux supplices sous l’empereur Alexandre Sévère avant d’être décapitée. Rome lui a consacré une église au pied du Capitole.",
"Présentation du Seigneur":"Quarante jours après Noël, Marie et Joseph présentent Jésus au Temple de Jérusalem, selon la Loi. Le vieillard Siméon le prend dans ses bras et le déclare « lumière pour éclairer les nations » ; la prophétesse Anne rend grâce. D’où les cierges bénits de la Chandeleur, le 2 février.",
"Sainte Véronique":"Selon une tradition ancienne, Véronique est la femme qui, sur le chemin de croix, essuie le visage de Jésus avec un voile, où l’empreinte de son visage serait restée. L’Évangile ne la mentionne pas, mais le chemin de croix la compte parmi ses stations.",
"Sainte Agathe":"Agathe, jeune Sicilienne de Catane, refuse les avances du gouverneur Quintien et choisit de rester fidèle au Christ. Elle subit de graves supplices et meurt en prison vers 251. Son culte est très répandu : on bénit des pains en son honneur le 5 février, et elle est invoquée contre les incendies.",
"Saint Paul Miki":"Paul Miki, jésuite japonais né vers 1564, prêche avec succès à ses compatriotes. Lors de la persécution lancée par Hideyoshi, il est arrêté avec vingt-cinq autres chrétiens, marché jusqu’à Nagasaki et crucifié le 5 février 1597. Il pardonne à ses bourreaux depuis sa croix. Canonisé en 1862.",
"Sainte Joséphine Bakhita":"Née vers 1869 au Darfour, Bakhita est enlevée enfant par des marchands d’esclaves et revendue plusieurs fois. Achetée par un consul italien, elle découvre la foi chrétienne en Italie, où elle est libre et rejoint les Canossiennes. Elle y vit avec douceur jusqu’en 1947 ; canonisée en 2000.",
"Sainte Apolline":"Apolline, vierge d’un âge avancé selon la tradition, est arrêtée à Alexandrie en 249 lors d’une émeute anti-chrétienne. On lui brise les dents, puis on la menace du feu ; elle se jette elle-même dans le bûcher plutôt que de renier sa foi. Patronne des dentistes.",
"Sainte Scholastique":"Scholastique, sœur jumelle de Benoît de Nursie, se consacre à Dieu et vit près de Monte Cassino. Elle rend visite à son frère une fois par an. Lors de leur dernière rencontre, un orage empêche Benoît de repartir, et ils parlent toute la nuit de Dieu. Elle meurt peu après, vers 547.",
