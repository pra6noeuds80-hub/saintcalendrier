"Notre-Dame de Lourdes":"Le 11 février 1858, Bernadette Soubirous voit une « Dame » à la grotte de Massabielle, à Lourdes. Il y aura dix-huit apparitions. Une source jaillit, et les pèlerins affluent. Lourdes est aujourd’hui l’un des premiers lieux de pèlerinage du monde, avec la journée mondiale des malades.",
"Saint Claude de La Colombière":"Jésuite né en 1641 près de Lyon, Claude de La Colombière devient le directeur spirituel de Marguerite-Marie Alacoque à Paray-le-Monial. Il soutient la dévotion au Sacré-Cœur qu’elle annonce. Mort à quarante et un ans, en 1682, il laisse des sermons et des lettres spirituelles.",
"Saint Alexis":"Alexis Falconieri est l’un des sept marchands de Florence qui, en 1233, quittent le monde pour vivre dans la prière sur le mont Senario. De leur communauté naîtra l’ordre des Servites de Marie. Alexis, le dernier survivant des sept, meurt très âgé en 1310.",
"Saint Siméon":"Siméon, cousin de Jésus selon la tradition, devient évêque de Jérusalem après la mort de Jacques, vers 62. Il guide la communauté pendant plusieurs décennies. Sous l’empereur Trajan, il est dénoncé comme chrétien et mis à mort vers 107, à un âge très avancé.",
"Saint Pierre Damien":"Né vers 1007 à Ravenne, Pierre Damien devient moine à Fonte Avellana, puis cardinal-évêque d’Ostie. Il lutte contre la corruption du clergé et prêche la réforme de l’Église. Il accomplit plusieurs missions de paix pour les papes. Il meurt en 1072 ; docteur de l’Église.",
"Chaire de saint Pierre":"Le 22 février, l’Église fête la « chaire » de Pierre, le siège symbolique d’où l’apôtre enseigne et gouverne. Cette fête, très ancienne à Rome, rappelle que Jésus a confié à Pierre la mission de confirmer ses frères et d’assurer l’unité de l’Église.",
"Saint Polycarpe":"Polycarpe, évêque de Smyrne, est disciple de l’apôtre Jean. Lors d’une persécution vers 155, on lui demande de maudire le Christ ; il répond qu’il le sert depuis quatre-vingt-six ans et ne l’a jamais trahi. Il est mis à mort sur un bûcher. Son martyre est le premier récit conservé en détail.",
"Saint Gabriel de l’Addolorata":"Francesco Possenti, né à Assise en 1838, mène une jeunesse brillante avant d’entrer chez les Passionistes sous le nom de Gabriel de la Vierge des Douleurs. Il vit avec ferveur sa vie de prière et meurt de la tuberculose à vingt-quatre ans, en 1862. Canonisé en 1920, il est le patron de la jeunesse.",
"Saint Romain":"Romain, né vers 390, se retire dans les forêts du Jura, à Condat. Des disciples le rejoignent, bientôt aussi son frère Lupicin. Ils fondent un monastère qui deviendra l’abbaye de Saint-Claude. Romain meurt vers 460, père d’une des premières communautés monastiques de Gaule.",
"Saint Oswald":"Oswald, d’origine danoise, devient moine à Fleury-sur-Loire puis évêque de Worcester en 961 et archevêque d’York. Il réforme les monastères anglais selon la règle bénédictine et protège les pauvres. Il meurt le 29 février 992 à Worcester, en lavant les pieds de pauvres."};
function getS(m,d){const x=getS0(m,d);if(x&&HH[x.n])x.h=HH[x.n];if(x&&X[x.n]){const e=X[x.n];x.v=e[0].split(",");x.f=e[1].split(",");x.p=e[2];x.h=e[3];x.t=e[4]}return x}
function getS0(m,d){const f=S.find(s=>s.m===m&&s.d===d);if(f)return f;const r=N[m].split("|")[d-1];if(!r||r==="-")return null;
const n=r[0]==="!"?r.slice(1):r[0]==="~"?"Sainte "+r.slice(1):"Saint "+r,fe=r[0]==="!";let h=0;for(const c of n)h+=c.charCodeAt(0);
return{m,d,n,t:fe?"Fête du calendrier chrétien":"Saint du jour",c:["#7a2a3a","#2a5a8a","#5a2a6a","#2a6a5a","#6b4a2b","#8a2a2a"][h%6],s:fe?"✝️":"🕊️",v:["Foi","Prière","Service des autres"],f:["Fragilité humaine, relevée par la grâce"],p:fe?"Seigneur, fais-nous entrer dans le mystère que nous célébrons aujourd’hui et garde-nous dans ta paix.":n+", prie pour nous ; aide-nous à suivre le Christ avec foi, courage et fidélité.",h:"Fêté le "+d+" "+M[m].toLowerCase()+". Carte simplifiée : valeurs et prière sont communes à tous les saints ; une fiche détaillée peut être ajoutée."}}
const H={"Sainte Agnès":"Agnès vit à Rome au début du IVe siècle, sous les persécutions de Dioclétien. Très jeune, elle consacre sa vie au Christ et refuse un prétendant païen qui la dénonce. Aucun supplice ne la fait céder : elle meurt martyre vers 304. Sa tombe, sur la via Nomentana, attire très tôt les pèlerins. Chaque 21 janvier, on bénit encore deux agneaux en son honneur.",
"Saint Valentin":"Les sources sur Valentin sont rares et mêlées de légende. Il aurait été prêtre à Rome, puis martyrisé sur la via Flaminia au IIIe siècle, un 14 février. Sa mémoire est célébrée dès le Ve siècle. Au Moyen Âge, sa fête rejoint le printemps des oiseaux et des amoureux, d’où son rôle de patron des couples.",
"Saint Joseph":"Descendant de David, Joseph est charpentier à Nazareth. Fiancé à Marie, il apprend qu’elle attend un enfant et, averti en songe par un ange, la prend chez lui. Il conduit la Sainte Famille à Bethléem, puis en Égypte pour fuir Hérode, et transmet son métier à Jésus. L’Évangile ne rapporte aucune de ses paroles : il agit et se tait.",
"Sainte Bernadette":"Née à Lourdes en 1844 dans une famille misérable, Bernadette Soubirous a quatorze ans quand, le 11 février 1858, une « Dame » lui apparaît à la grotte de Massabielle. Malgré les moqueries et les interrogatoires, elle maintient son récit, et une source jaillit. Entrée chez les Sœurs de la Charité à Nevers en 1866, elle meurt en 1879 et est canonisée en 1933.",
"Saint Georges":"Georges serait né en Cappadoce et devenu officier de l’armée romaine. Sous Dioclétien, il refuse de sacrifier aux dieux et meurt martyr, sans doute à Lydda en Palestine, vers 303. Le récit du dragon, ajouté au Moyen Âge, symbolise la victoire du bien sur le mal. Il est patron de l’Angleterre, de la Géorgie et de nombreux chevaliers.",
"Sainte Rita":"Née près de Cascia, en Ombrie, en 1381, Rita est mariée jeune à un homme violent, dont elle supporte les brutalités avec patience. Il est assassiné ; elle dissuade ses fils de se venger. Veuve, elle entre chez les Augustines de Cascia, où elle prie pendant des dizaines d’années. Elle meurt en 1457, et on l’invoque dans les situations sans issue.",
"Sainte Jeanne d’Arc":"Née vers 1412 à Domrémy, Jeanne dit entendre des voix qui lui demandent de libérer la France. En 1429, elle convainc Charles VII, fait lever le siège d’Orléans et conduit le roi à Reims pour son sacre. Capturée à Compiègne et livrée aux Anglais, elle est condamnée à Rouen et brûlée vive le 30 mai 1431. Réhabilitée en 1456, elle est canonisée en 1920.",
"Saint Antoine de Padoue":"Né à Lisbonne vers 1195, Fernando entre chez les chanoines augustins puis, ému par le martyre de franciscains au Maroc, rejoint les Frères mineurs et prend le nom d’Antoine. Sa science biblique et sa parole le rendent célèbre en Italie et en France. Il meurt près de Padoue le 13 juin 1231 et est canonisé moins d’un an plus tard.",
"Saint Jean-Baptiste":"Fils de Zacharie et d’Élisabeth, Jean naît six mois avant Jésus. Il vit au désert, vêtu de poils de chameau, et appelle à la conversion. Il baptise Jésus dans le Jourdain et le désigne comme l’Agneau de Dieu. Ayant reproché son union au roi Hérode Antipas, il est emprisonné puis décapité.",
"Saint Pierre":"Simon, pêcheur de Capharnaüm, est appelé par Jésus qui le nomme Pierre, « le roc ». Il confesse que Jésus est le Christ, mais le renie trois fois la nuit de la Passion. Pardonné, il devient le guide de la première communauté, prêche à Jérusalem puis, selon la tradition, à Rome, où il serait mort crucifié sous Néron, vers 64-67.",
"Sainte Marie-Madeleine":"Originaire de Magdala, Marie dite la Madeleine est guérie par Jésus et le suit avec d’autres femmes. Elle se tient au pied de la croix, puis se rend au tombeau le matin de Pâques. Jésus lui apparaît et l’envoie annoncer sa résurrection aux apôtres, ce qui lui vaut le titre d’« apôtre des apôtres ».",
"Sainte Anne":"Les Évangiles ne parlent pas d’Anne : c’est le Protévangile de Jacques, texte du IIe siècle, qui la nomme mère de Marie et épouse de Joachim. Longtemps sans enfant, elle obtient une fille dans la prière. Son culte se répand en Orient puis en Occident au Moyen Âge, notamment en Bretagne, à Sainte-Anne-d’Auray.",
"Saint Ignace de Loyola":"Né en 1491 au pays basque, Íñigo de Loyola est un chevalier blessé en 1521 au siège de Pampelune. Pendant sa convalescence, il lit la vie du Christ et des saints et se convertit. Il rédige les Exercices spirituels, étudie à Paris et fonde avec six compagnons la Compagnie de Jésus, approuvée en 1540. Il meurt à Rome en 1556.",
"Saint Jean-Marie Vianney":"Né en 1786 près de Lyon, Jean-Marie peine dans ses études mais devient prêtre en 1815. Envoyé en 1818 à Ars, village de l’Ain peu pratiquant, il visite les familles, soigne l’église et passe jusqu’à seize heures par jour au confessionnal. Des milliers de pèlerins viennent le voir. Il meurt en 1859 et est canonisé en 1925.",
"Saint Augustin":"Né en 354 à Thagaste, en Afrique du Nord, Augustin enseigne la rhétorique, mène une vie agitée et cherche la vérité chez les manichéens. À Milan, l’évêque Ambroise et les prières de sa mère Monique l’amènent à se convertir ; il est baptisé en 387. Évêque d’Hippone, il écrit les Confessions et La Cité de Dieu. Il meurt en 430, la ville assiégée par les Vandales.",
"Saint Firmin":"Selon la tradition, Firmin, originaire d’Espagne, est consacré évêque et envoyé évangéliser la Gaule. Il prêche dans la région d’Amiens, où il baptise de nombreux habitants, avant d’être décapité. Son souvenir reste très vivant à Amiens, où ses reliques sont vénérées et où la cathédrale évoque sa vie dans ses sculptures.",
"Saint Jérôme":"Né vers 347 en Dalmatie, Jérôme étudie à Rome, puis se retire au désert de Syrie. Secrétaire du pape Damase, il reçoit la mission de réviser les traductions latines de la Bible. Installé à Bethléem vers 386, il apprend l’hébreu et traduit les Écritures, ce qui donnera la Vulgate. Il meurt en 420, laissant aussi de nombreux commentaires et lettres.",
"Sainte Thérèse de Lisieux":"Née à Alençon en 1873, Thérèse Martin perd sa mère à quatre ans et grandit à Lisieux. À quinze ans, elle obtient d’entrer au Carmel. Elle y vit cachée, écrit son manuscrit autobiographique, Histoire d’une âme, et enseigne la confiance en l’amour de Dieu dans les plus petites choses. Atteinte de tuberculose, elle meurt en 1897 et est canonisée en 1925.",
"Saint François d’Assise":"Né vers 1182, Francesco, fils d’un riche drapier, rêve de gloire militaire. Une maladie, puis une voix devant le crucifix de Saint-Damien, le transforment. Il renonce à ses biens, vit pauvrement et attire des compagnons : les Frères mineurs. Il crée la crèche de Greccio en 1223, reçoit les stigmates en 1224 et meurt en 1226 à Assise.",
"Sainte Thérèse d’Avila":"Née en 1515 à Ávila, Teresa de Ahumada entre au Carmel de l’Incarnation à vingt ans. Après des années de tiédeur, elle connaît une profonde vie de prière. En 1562, elle fonde le monastère Saint-Joseph, première maison d’une réforme du Carmel, malgré les oppositions. Elle écrit le Livre de la vie et Le Château intérieur, et meurt en 1582.",
"Saint Martin de Tours":"Né vers 316 en Pannonie, Martin devient soldat romain. Un hiver, aux portes d’Amiens, il coupe son manteau pour couvrir un pauvre ; la nuit suivante, il voit le Christ vêtu de ce manteau. Baptisé, il quitte l’armée, fonde un monastère à Ligugé puis devient évêque de Tours en 371. Il évangélise les campagnes et meurt en 397.",
"Sainte Catherine d’Alexandrie":"Les plus anciens récits de sa vie datent de plusieurs siècles après sa mort supposée. Ils racontent qu’une jeune savante d’Alexandrie, au début du IVe siècle, tient tête à de nombreux philosophes païens. Refusant d’épouser l’empereur, elle est martyrisée. Très populaire au Moyen Âge, elle est la patronne des philosophes et des jeunes filles.",
"Saint André":"Originaire de Bethsaïde, André pêche sur le lac de Tibériade. D’abord disciple de Jean-Baptiste, il suit Jésus et lui amène son frère Simon. Lors de la multiplication des pains, c’est lui qui signale l’enfant aux cinq pains. La tradition le dit mort crucifié à Patras, sur une croix en forme de X, d’où la « croix de Saint-André ».",
"Saint Nicolas":"Nicolas est évêque de Myre, en Asie Mineure, au IVe siècle. Les récits racontent qu’il a offert en secret de l’or à trois jeunes filles sans dot et protégé des innocents et des marins. Ses reliques sont emportées à Bari en 1087. Sa générosité a inspiré la tradition des cadeaux aux enfants, le 6 décembre, dans l’est et le nord de la France.",
"Saint Étienne":"Étienne est l’un des sept diacres choisis à Jérusalem pour servir les pauvres. Plein de foi, il parle avec force devant le Sanhédrin. Accusé de blasphème, il est lapidé hors de la ville, vers l’an 35, et prie pour ses bourreaux. Parmi les témoins se trouvait Saul, futur apôtre Paul. Il est le premier martyr chrétien.",
"Saint Jean l’Évangéliste":"Fils de Zébédée et frère de Jacques, Jean est pêcheur quand Jésus l’appelle. Proche du Maître, il est présent à la Transfiguration, à la Cène et au pied de la croix, où Jésus lui confie Marie. La tradition lui attribue le quatrième Évangile, trois lettres et l’Apocalypse, et le dit mort très âgé à Éphèse."};
const now=new Date(),Y=now.getFullYear();let cm=now.getMonth();
const $=i=>document.getElementById(i);
function portrait(s){let h=0;for(const c of s.n)h+=c.charCodeAt(0);
const hair=["#3b2a1a","#6b4a2b","#b9b0a0","#1c1c1c"][h%4],skin=["#e8c39e","#d9a77c","#f1d2b3"][h%3];
return `<svg viewBox="0 0 120 150" class="por"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2a5c"/><stop offset="1" stop-color="#7a1c2a"/></linearGradient></defs><rect width="120" height="150" fill="url(#g1)"/><circle cx="60" cy="52" r="34" fill="#f2d27a" opacity=".35"/><circle cx="60" cy="52" r="30" fill="none" stroke="#f2d27a" stroke-width="3"/><path d="M18 150 Q22 92 60 88 Q98 92 102 150Z" fill="${s.c}" stroke="#f2d27a" stroke-width="1.5"/><rect x="52" y="74" width="16" height="16" fill="${skin}"/><ellipse cx="60" cy="54" rx="17" ry="20" fill="${skin}"/><path d="M42 52 Q42 30 60 31 Q78 30 78 52 Q74 40 60 40 Q46 40 42 52Z" fill="${hair}"/><circle cx="53" cy="56" r="1.8" fill="#222"/><circle cx="67" cy="56" r="1.8" fill="#222"/><path d="M54 66 Q60 70 66 66" stroke="#8a3a2a" fill="none" stroke-width="1.6"/><g id="cr"><circle cx="60" cy="118" r="20" fill="transparent"/><path d="M60 100V136M47 112H73" stroke="#3a0a14" stroke-width="8" stroke-linecap="round"/><path d="M60 100V136M47 112H73" stroke="#f2d27a" stroke-width="4.5" stroke-linecap="round"/></g><text x="100" y="142" font-size="20" text-anchor="middle">${s.s}</text></svg>`}
function open(s){const ini=s.n.replace(/^(Saint|Sainte) (d’|de |l’)?/,"").charAt(0).toUpperCase();
$("cd").innerHTML=`<div class="card"><i class="cx tl">✝<b>${ini}</b></i><i class="cx br">✝<b>${ini}</b></i>
<div class="orn">✠ ✠ ✠</div>${portrait(s)}<div class="hint">✝ Touche la croix sur l’habit pour déplier l’histoire</div><h3>${s.n}</h3><div class="ti">${s.t}</div><div class="dt">${s.d===1?"1er":s.d} ${M[s.m].toUpperCase()}</div>
<h4>✦ Valeurs</h4><ul>${s.v.map(x=>`<li>${x}</li>`).join("")}</ul>
<h4>✦ Défauts</h4><ul>${s.f.map(x=>`<li>${x}</li>`).join("")}</ul>
<h4>✦ Prière</h4><p class="pr">${s.p}</p>
<div id="hs" class="hs"><h4>✦ Histoire</h4><p>${H[s.n]||s.h}</p></div><div class="orn">✠ Amen ✠</div></div>`;
$("ov").classList.add("on");$("ov").scrollTop=0}
function draw(){$("mt").textContent=M[cm]+" "+Y;let h="";
["L","M","M","J","V","S","D"].forEach(x=>h+=`<b>${x}</b>`);
const off=(new Date(Y,cm,1).getDay()+6)%7,nb=new Date(Y,cm+1,0).getDate();
for(let i=0;i<off;i++)h+="<span></span>";
const L=S.filter(s=>s.m===cm);
for(let d=1;d<=nb;d++){const s=getS(cm,d),t=(d===now.getDate()&&cm===now.getMonth())?" t":"";
h+=s?`<button class="d s${t}" data-d="${d}">${d}<small>✝ ${s.n.replace(/^(Saint|Sainte) /,"")}</small></button>`:`<div class="d${t}">${d}</div>`}
$("g").innerHTML=h;
$("ch").innerHTML=L.length?L.map(s=>`<button data-d="${s.d}">${s.s} ${s.d} · ${s.n}</button>`).join(""):'<p class="vide">Pas de carte ce mois-ci pour le moment.</p>'}
document.addEventListener("click",e=>{if(e.target.closest("#cr")){$("hs").classList.toggle("on");return}const b=e.target.closest("[data-d]");if(b)open(getS(cm,+b.dataset.d))});
$("pv").onclick=()=>{cm=(cm+11)%12;draw()};$("nx").onclick=()=>{cm=(cm+1)%12;draw()};
$("cl").onclick=()=>$("ov").classList.remove("on");
$("ov").onclick=e=>{if(e.target.id==="ov")$("ov").classList.remove("on")};
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const ALL=[];for(let m=0;m<12;m++){const nb=new Date(2024,m+1,0).getDate();for(let d=1;d<=nb;d++){const s=getS(m,d);if(s)ALL.push({m,d,n:s.n,k:norm(s.n)})}}
function lst(q){q=norm(q.trim());let h="",lm=-1;const L=q?ALL.filter(x=>x.k.includes(q)):ALL;
for(const x of L){if(!q&&x.m!==lm){h+=`<h5>${M[x.m]}</h5>`;lm=x.m}h+=`<button data-m="${x.m}" data-d2="${x.d}"><b>${x.d===1?"1er":x.d} ${M[x.m].toLowerCase()}</b>${x.n}</button>`}
$("dl").innerHTML=h||'<p class="vide">Aucun saint trouvé.</p>';$("cnt").textContent=L.length+" saint"+(L.length>1?"s":"")}
$("q").oninput=e=>lst(e.target.value);
$("bg").onclick=()=>{$("dr").classList.add("on");lst($("q").value)};

$("dl").onclick=e=>{const b=e.target.closest("[data-m]");if(!b)return;cm=+b.dataset.m;draw();$("dr").classList.remove("on");open(getS(cm,+b.dataset.d2))};
